<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢世代指南 — 1025 全國寶可夢圖鑑</title>
  <meta name="description" content="寶可夢九個世代的完整指南：地區、推出年份、國家圖鑑編號範圍、新機制、新屬性、主要遊戲、傳說與幻之寶可夢，以及每一代的御三家。">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1020">
  <!-- Blocking, inline, and before the stylesheet on purpose. It has to resolve a
       theme before the first paint so the page never flashes one palette and then
       repaints in the other; a module in shared.js cannot do this because module
       scripts are deferred by definition. It is also the only place a theme is
       resolved, and it ALWAYS writes a concrete value, which is why shared.css
       has no prefers-color-scheme media query: a `:root:not([data-theme="dark"])`
       block could never match once this runs. :root's dark palette is the no-JS
       fallback. Kept in sync with THEME_COLORS in assets/js/shared.js. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('pokemon-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* private mode / storage disabled: stay on the default */ }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0b1020');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <style>
    /* ===== Generations page =====
       Page-specific only. Everything here is either (a) a colour the page owns —
       the nine generation gradients and the chip pairs, which have no counterpart
       in shared.css because no other page has them — or (b) geometry that only
       this layout needs. Markup is emitted by renderGenerations() in this file,
       not by shared.js, so the rules live beside the emitter by the same
       convention that moved the evolution chain's CSS out of detail.html's
       inline <style> block and into detail.css. */

    /* 1280px, the source page's own max-w-7xl. Its inner hero is max-w-7xl with
       px-8, so 1280 - 2×16 here lands within 16px of the reference's content
       column without the hero needing its own second container. */
    .gen-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    /* ===== Breadcrumb =====
       A real <nav> with aria-current, not three <a>s in a row: it is a
       hierarchy, and the last item is not a link because it is where you are. */
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }

    .breadcrumb [aria-current="page"] {
      color: var(--text-primary);
      font-weight: bold;
    }

    .breadcrumb .sep {
      color: var(--hairline-strong);
    }

    /* ===== Hero =====
       The source page's hero is bg-gradient-to-br indigo-600 → purple-600 →
       pink-600, under a black/10 scrim, with a 60×60 sparkle tile at 10%. All
       three are copied. The 600 steps clear AA where the old 700-level rule
       also cleared it, and the copy is now exact rather than an approximation
       of a different step — see AGENTS.md gotcha 43.

       Two values are NOT copied, and both are the same mistake: a white
       overlay LIGHTENS the fill, so on a mid-tone gradient it pushes white
       text DOWN rather than up. Measured over 101 samples of this gradient,
       at its lightest end:
         span  text-white/70   3.35:1  FAIL   -> white/90   4.69:1
         tile  bg-white/10     3.58:1  FAIL   -> black/10   4.62:1
       The h1 (5.48:1) and the lede (4.69:1) are fine as the source has them.
       The scrim is black, which is gotcha 39's rule for a light-text band. */
    .gen-hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: linear-gradient(to bottom right, #4f46e5 0%, #9333ea 50%, #db2777 100%);
      color: #fff;
      padding: 64px 16px;
      margin-bottom: 40px;
      box-shadow: var(--shadow-card);
      isolation: isolate;
    }

    /* The two overlay layers. Both are absolutely positioned over the gradient.
       `z-index` is explicit on BOTH sides of this, and that is the whole point:
       `position: relative` alone does NOT lift the content above them. Positioned
       descendants with `z-index: auto` are all painted in step 6 of the painting
       order, in TREE ORDER, and `::after` is always the LAST child — so with only
       `position: relative` the sparkle layer sits ON TOP of the h1, which is the
       opposite of what it looks like it does. At opacity 0.1 that is nearly
       invisible over white text, so it reads as working. Pin the overlays to 0
       and the content to 1 and the ordering holds by construction.
       `isolation: isolate` on the hero keeps them compositing against the
       gradient rather than against whatever is behind the card. */
    .gen-hero::before,
    .gen-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .gen-hero::before {
      background: rgba(0, 0, 0, 0.1);
    }

    /* The source's sparkle tile verbatim: four plus-marks at 40% white in a
       60×60 SVG, laid down at 10% opacity. The SVG carries its own intrinsic
       size, so it tiles at 60px without a background-size. */
    .gen-hero::after {
      opacity: 0.1;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .gen-hero > * {
      position: relative;
      z-index: 1;
    }

    .gen-hero-title {
      margin: 0 0 16px;
      font-size: 36px;
      line-height: 1.2;
      font-weight: bold;
      text-align: center;
      text-shadow: var(--header-title-shadow);
    }

    .gen-hero-lede {
      margin: 0 auto 16px;
      max-width: 768px;
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    .gen-hero-span {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    /* The source is 2 tiles on mobile and 4 from sm, not auto-fit. At a 320px
       viewport auto-fit also lands on 2, so this is not a visual fix — it is so
       the two column counts are named rather than emergent. */
    .gen-hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 40px auto 0;
      max-width: 768px;
      padding: 0;
      list-style: none;
    }

    /* black/10, not the source's white/10 — see the block comment above for
       the 3.58:1 that decided it. The white/18 border is kept (down from 0.22)
       because a darker tile on a lighter gradient needs its edge, and it is
       the reason the print rule below can find something to restate. */
    .gen-hero-stats li {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .gen-hero-stats strong {
      display: block;
      font-size: 30px;
      line-height: 1.2;
      font-weight: bold;
    }

    .gen-hero-stats span {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    @media (min-width: 640px) {
      .gen-hero {
        padding: 80px 24px;
      }

      .gen-hero-title {
        font-size: 48px;
      }

      .gen-hero-lede {
        font-size: 20px;
      }

      .gen-hero-stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .gen-hero-title {
        font-size: 60px;
      }
    }

    /* The wave sits after the stats in the DOM, absolutely positioned against
       the hero, and inherits the page's own background so it reads as a cut-out
       rather than a third colour. `preserveAspectRatio="none"` on the element
       lets the single path stretch to whatever width the hero is.

       The path and the 48px height are the source's own (viewBox 0 0 1200 120,
       h-12). The source can fill it text-blue-50 only because its whole page
       sits on a blue-50 wash; we take --bg-primary, because we keep the dark
       page background instead of adopting that wash. Same reason the hero stays
       inside .gen-page rather than going full-bleed. */
    .gen-wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 48px;
      display: block;
      fill: var(--bg-primary);
      pointer-events: none;
    }

    /* ===== Section head =====
       The source's 寶可夢的進化 heading sits above the card list, outside it.
       It is the page's only h2 before the per-card h2s, and it is what the
       hero's closing sentence introduces. */
    .gen-section-head {
      max-width: 672px;
      margin: 0 auto 32px;
      text-align: center;
    }

    .gen-section-head h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .gen-section-head p {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* ===== Card list ===== */
    .gen-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* No border. The source's cards are edge-to-edge colour panels separated by
       white space, and a hairline here fought the accent panel: a 1px line
       between two differently-coloured regions reads as a seam, not an edge.
       Dropping it also deleted the gen-V special case below. */
    .gen-card {
      display: grid;
      grid-template-columns: 1fr;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--transition-fast);
    }

    /* 16px is the source's rounded-2xl. --radius-md (15px) is the site's
       near-equivalent if this ever needs to be a token instead. */
    .gen-card:hover {
      box-shadow: var(--shadow-card-hover);
    }

    /* 1024px is the site's existing content breakpoint, which is also where the
       source moves from stacked to 3+9. Below it the side panel stacks above
       the body and both go full width. */
    @media (min-width: 1024px) {
      .gen-card {
        grid-template-columns: repeat(12, 1fr);
      }

      .gen-card-side {
        grid-column: span 3;
      }

      .gen-card-body {
        grid-column: span 9;
      }
    }

    /* The nine side-panel gradients. Each pair keeps the source page's hue but
       at a DESATURATED 700 step, because the source's own 500-level values put
       white text below 4.5:1 on all nine of its card gradients, and the worst of
       them is 2.15:1 — gen II, amber-500 → purple-500 (AGENTS.md gotcha 43).
       Saturation is what the source trades
       away, not lightness, which is why these read as muted rather than dark.

       Every text layer below is sampled every 1% of the interpolation, because
       a gradient's worst point is not reliably its midpoint nor its lightest
       endpoint. Worst case per layer across all nine, of the values on this
       panel (numeral and region are large bold text, so they only need 3:1):

         numeral 52px bold    6.77:1        year   13px /0.88   5.66:1
         region  20px bold    6.77:1        glass  12px /0.85   7.04:1
         label   12px /0.85   5.41:1        glass  14px /1.00   9.02:1

       The binding layer is the 12px 世代 label at 5.41:1, not the 52px numeral.
       135deg, not the source's bg-gradient-to-br: the side panel's aspect ratio
       is set by its content, so a corner-directed gradient renders at a
       different angle on every one of the nine cards, while a fixed angle gives
       all nine the same character. */
    .gen-card[data-gen="1"] { --gen-accent: linear-gradient(135deg, #873939 0%, #40589d 100%); }
    .gen-card[data-gen="2"] { --gen-accent: linear-gradient(135deg, #725325 0%, #6f4197 100%); }
    .gen-card[data-gen="3"] { --gen-accent: linear-gradient(135deg, #295e3c 0%, #40589d 100%); }
    .gen-card[data-gen="4"] { --gen-accent: linear-gradient(135deg, #554f99 0%, #893759 100%); }
    .gen-card[data-gen="5"] { --gen-accent: linear-gradient(135deg, #373c44 0%, #40589d 100%); }
    .gen-card[data-gen="6"] { --gen-accent: linear-gradient(135deg, #40589d 0%, #873939 100%); }
    .gen-card[data-gen="7"] { --gen-accent: linear-gradient(135deg, #8a4a30 0%, #225551 100%); }
    .gen-card[data-gen="8"] { --gen-accent: linear-gradient(135deg, #6f4197 0%, #873939 100%); }
    .gen-card[data-gen="9"] { --gen-accent: linear-gradient(135deg, #6a47a0 0%, #8a4a30 100%); }

    /* ===== Card: accent side ===== */
    /* 24px 20px at every width, with no >=1024px bump. The side panel is 3 of
       the card's 12 columns, so it is NARROWEST at exactly 1024px: 248px, of
       which 208px is content. The widest thing it holds is the 編號範圍 glass
       box at ~130px, and a probe at 320/390/700/1100/1440 reports 0px of
       horizontal overflow with 0 offending elements, so a larger inset would
       spend 24px of a 312px panel to move nothing. Re-measure with
       getBoundingClientRect before changing either number. */
    .gen-card-side {
      background: var(--gen-accent);
      color: #fff;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gen-card-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
    }

    .gen-card-name {
      margin: 0;
      font-size: 20px;
    }

    .gen-card-numeral {
      display: block;
      font-size: 52px;
      line-height: 1.05;
      font-weight: 800;
      text-shadow: var(--header-title-shadow);
    }

    .gen-card-region {
      display: block;
      font-size: 20px;
      font-weight: bold;
    }

    .gen-card-year {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.88);
    }

    /* black/20, not white/20 — the same reasoning as the hero's tile, and for
       the same reason: a white overlay lightens. Measured over the nine
       gradients above, white/20 lands between 3.41:1 (gen II) and 4.68:1
       (gen VIII) and fails 4.5:1 on eight of the nine; black/20 measures
       7.04:1 on the label and 9.02:1 on the value.

       This box also carries the new-B count now. The source stacks the count
       beside the range rather than under it, and at the 3-column desktop width
       a 7-character range like #001 – #151 has no room for it — which is why
       the count moved in here rather than gaining a second line. */
    .gen-card-range {
      margin-top: 16px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .gen-card-range-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
    }

    .gen-card-range-value {
      font-size: 14px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .gen-card-count {
      margin: 4px 0 0;
      font-size: 13px;
    }

    /* The CTA moved to the foot of the body column. On the accent panel it was
       the only element pinned with margin-top:auto, so the panel's height was
       set by the tallest card's body rather than by its own content, and the
       button's hit area was white-on-gradient at 13px. In the body it is an
       ordinary footer action over --bg-card, where it inherits --text-primary
       and needs no colour of its own. */
    .gen-card-cta {
      display: inline-block;
      margin-top: 4px;
      padding: 9px 14px;
      background: var(--surface-raised);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      transition: background var(--transition-fast);
    }

    .gen-card-cta:hover {
      background: var(--surface-hover);
    }

    /* ===== Card: body ===== */
    .gen-card-body {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .gen-card-desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-secondary);
    }

    /* ===== Body rows =====
       Three explicit rows rather than one auto-flow grid. The source pairs
       新機制|新屬性 on the first row, 主要遊戲|最初的夥伴 on the second, and
       gives 傳說 & 幻之寶可夢 a full-width row of its own — and 新屬性 exists on
       only two of the nine cards, so a single grid cannot hold that shape: it
       paired 新機制|主要遊戲, stranded 最初的夥伴, and pushed 新屬性 to a row
       of its own whenever it appeared. Naming the rows makes the optional box
       land in the right place instead of wherever auto-flow puts it. */
    .gen-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      margin-bottom: 24px;
    }

    .gen-row:last-child {
      margin-bottom: 0;
    }

    /* A row with one box spans the full width instead of sitting in the first of
       two tracks. Two rows need this: 傳說 & 幻之 is always alone, and 新機制 is
       alone on the seven generations with no 新屬性 (it exists on gen II and VI
       only).

       The source leaves both halves empty — its first row is `md:grid-cols-2`
       with 新屬性 as an optional child, so 7 of its 9 cards have a half-width
       新機制 box and a gap beside it. This is a deliberate deviation rather than
       an oversight, and it is the one layout change here: the two-column
       pairing is preserved exactly where the source has it, and a row is filled
       everywhere else. Spanning is a structural consequence of the child count,
       not a tuned breakpoint, so it cannot go stale if 新屬性 is ever added to
       another generation. */
    .gen-row > :only-child {
      grid-column: 1 / -1;
    }

    @media (min-width: 768px) {
      .gen-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .gen-box {
      background: var(--bg-secondary);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      min-width: 0;
    }

    /* The source puts a 16px stroke icon in each of these five headings. It is
       the one icon set on the page that is not `currentColor`-fillable by the
       shared `.icon` rule (gotcha 27), because these are outline icons, not the
       site's filled set — so they carry their own size and stroke and are
       hidden from assistive tech, with the heading text carrying the meaning. */
    .gen-box h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .gen-box-icon {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== Chips =====
       Six roles, six pairs, each measured against the surface it actually sits
       on (--bg-card #21262d in dark, #ffffff in light). A single "grey chip"
       token cannot serve both themes: --surface-raised flips from #262c33 to
       #e8eaed and --text-secondary from #c9d1d9 to #424a53, and the two only
       happen to pass together (9.13:1 / 7.46:1). */
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid transparent;
    }

    /* 傳說寶可夢 was amber and 幻之寶可夢 was pink as two separate text chips, so
       the split between the categories was once carried by the colour alone. The
       chips are image chips now (the sprite leads, the name follows) and the box
       is a single cloud, so the amber sits on every chip and 幻之 is carried by
       the pink badge on .gen-mythical-badge instead. .chip-legendary and
       .chip-mythical are therefore gone rather than left behind as dead rules;
       their contrast notes (dark 9.08/8.97:1, light 6.85/5.14:1) went with them. */

    /* The source's #db2777 on #fce7f3 is 3.91:1, which is why the light value
       here is the darker pink-700 rather than pink-600. */
    .chip-mechanic {
      background: rgba(168, 85, 247, 0.16);
      color: #d8b4fe;
    }

    [data-theme="light"] .chip-mechanic {
      background: #f3e8ff;
      color: #7e22ce;
    }

    /* 新屬性 — dark 7.32:1, light 6.23:1. Only reached if the English type key
       cannot be resolved from the Chinese label, because the two generations
       that have new types resolve cleanly and render the official type pill
       below instead. */
    .chip-newtype {
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
    }

    [data-theme="light"] .chip-newtype {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* The new-type row is the one place a generation card shows official type
       colours, and they are AA-correct by construction (badgeStyle() derives
       the text colour from the fill and only then darkens or lightens the fill
       until it clears 4.5:1, so 鋼's #B8B8D0 and 妖精's #EE99AC are fine in
       both themes). Only the SIZE is overridden, to sit at the same 12px as the
       four other chip roles in the same card — typeBadgeSmHtml() ships 10px for
       the Pokédex card footers and the move tables. Scoped to this box, so it
       cannot resize those (gotcha 20). */
    .gen-box-newtypes .type-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    /* 主要遊戲 — 9.13:1 dark, 7.46:1 light */
    .chip-game {
      background: var(--surface-raised);
      color: var(--text-secondary);
    }

    /* ===== Legendary / mythical cloud =====
       One flat chip cloud, the way the source shows it: a single
       `flex flex-wrap gap-3` container holding both categories, with 幻之 told
       apart by a pink badge on the chip rather than by a row label. The box
       heading already reads 傳說 & 幻之寶可夢, so a merged list still says which
       population a name belongs to — the badge is what carries it.

       The chip is the source's, transcribed: `px-3 py-2 gap-2 border
       rounded-lg` over `from-amber-50 to-yellow-50` with a `border-amber-200`
       edge. Three things about that need saying rather than copying.

       - The gradient is transcribed verbatim even though it is invisible.
         amber-50 #fffbeb and yellow-50 #fefce8 differ by (1,1,3) out of 255, so
         both ends are the same cream. Flattening it to a solid amber-50 would
         look identical and read better; the source's class string is the record
         of what it ships, so the gradient stays and the equivalence is noted.
       - 8px is the source's `rounded-lg`, which is not on this site's radius
         scale (the smallest token is --radius-sm at 12px), so it is a literal.
         The old chip was --radius-pill (20px), a stadium; the source's is a
         rounded RECTANGLE, which is the 矩型+些微圓角 this box was asked for.
       - The chip grew from 38px to 48px tall (a 32px sprite plus py-2's 16px).
         That is the source's own box and it makes 94 chips easier to hit, but it
         is a real change to the page's rhythm across all nine cards, not a
         no-op.

       Dark is the base rule and light restores the source's opaque values, which
       is gotcha 41's shape — but the dark fill is NOT gotcha 41's `-950 at low
       alpha`. That rule assumes a light surface to tint; .gen-box is already
       dark (--bg-secondary #161b22), so an amber tint disappears into it.  Measured
       separation from the box: amber-950 @0.30 is 1.02:1, worse than the
       1.23:1 of the --surface-raised chip it replaces, while amber-900 @0.70
       reaches 1.51:1 — the first value that actually reads as a chip.

       Measured, 14px name and 12px badge each against their own fill:
       light 9.94:1 name and 4.84:1 on hover, dark 9.22:1 name,
       badge light 5.14:1 and dark 11.43:1. */
    .gen-legend-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gen-legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(120, 53, 15, 0.70);
      border: 1px solid #b45309;
      border-radius: 8px;
      color: #fde68a;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      text-decoration: none;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .gen-legend-chip:hover {
      background: rgba(120, 53, 15, 0.85);
      border-color: #fbbf24;
      color: #fef3c7;
    }

    .gen-legend-chip img {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    /* 幻之寶可夢 — the source's own badge text, verbatim. The source's
       text-pink-600 #db2777 on bg-pink-100 #fce7f3 is 3.91:1 and misses AA at
       12px, so the light text is pink-700 #be185d instead: the same correction
       .chip-mechanic makes a few rules above. */
    .gen-mythical-badge {
      padding: 2px 6px;
      background: rgba(80, 7, 36, 0.30);
      border-radius: 9999px;
      color: #fbcfe8;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      white-space: nowrap;
    }

    /* The source's hover is `hover:border-amber-400` on the edge and
       `group-hover:text-amber-700` on the name — it does not touch the fill, so
       neither does the light form. */
    [data-theme="light"] .gen-legend-chip {
      background: linear-gradient(90deg, #fffbeb, #fefce8);
      border-color: #fde68a;
      color: #374151;
    }

    [data-theme="light"] .gen-legend-chip:hover {
      border-color: #fbbf24;
      color: #b45309;
    }

    [data-theme="light"] .gen-mythical-badge {
      background: #fce7f3;
      color: #be185d;
    }

    /* Unreachable today: all nine generations carry at least one legendary and
       at least one mythical. Kept as one box-level fallback rather than one per
       category, because a merged cloud has no second row to report an empty one
       in — without it a future generation with neither would render a heading
       over nothing at all. */
    .gen-legend-empty {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ===== Starters =====
       The source's three circles: a 56px round well with the 48px sprite
       centred inside it, the name below. flex, not the old 3-column grid —
       there are always exactly three, so a grid's 1fr tracks just stretch the
       first starter away from the other two and left the row reading as a
       table cell. flex + gap keeps all three the same width and the row the
       width of its content.

       The name takes --text-primary off .gen-box and needs no colour of its
       own, which is why this is correct in both themes with no override. What
       it does need is a real hit area, and the circle is that: 56px of target
       rather than 12px of text, with the whole link scaling on hover. */
    .starter-list {
      display: flex;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .starter-list a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition-fast);
    }

    .starter-list a:hover {
      transform: scale(1.1);
    }

    /* overflow:hidden plus a 48px child in a 56px box: object-fit alone would
       scale the 475px source down but let it overflow the rounded edge, and the
       sprite is a square so there is no aspect to letterbox away. */
    .starter-art {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      background: var(--surface-raised);
    }

    .starter-list img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .starter-name {
      font-size: 12px;
      text-align: center;
      line-height: 1.35;
    }

    /* ===== Error state =====
       Visible, and it says what failed. sorting.html's equivalent is a
       console.error behind a try/catch that reports "check your local server"
       for what was not a server problem (gotcha 23), so this page reports the
       actual failure and the URL that produced it. */
    .gen-error {
      padding: 20px;
      border: 1px solid var(--error-text);
      border-radius: var(--radius-sm);
      color: var(--error-text);
      font-size: 14px;
      line-height: 1.7;
    }

    @media print {
      /* Print is a third palette (see shared.css's @media print block). The
         accent panel is the one element that cannot survive it: browsers drop
         background colours unless the user ticks "background graphics", which
         would leave white text on white paper. The card's own border takes
         over as the boundary.

         The hero's two overlay layers have to be hidden explicitly, not left
         alone. `.gen-hero { background: none }` does nothing to a ::before
         that paints its OWN background, so the black/10 scrim would print as a
         10% grey rectangle on white paper and the sparkle tile would print on
         top of it — a texture that exists only to sit behind text.

         `.gen-row` needs no print rule: the two-column breakpoint is 768px and
         print is ~794px, so the rows print two-up, which is what they look like
         on screen. A rule forcing one column here would need re-measuring
         against the real print width, and the layout is better at two. */
      .gen-hero::before,
      .gen-hero::after {
        display: none;
      }

      .gen-hero {
        background: none;
        color: var(--text-primary);
        box-shadow: none;
        padding-bottom: 24px;
      }

      .gen-hero-title,
      .gen-hero-lede,
      .gen-hero-span,
      .gen-hero-stats span {
        color: var(--text-primary);
        text-shadow: none;
      }

      .gen-hero-stats li {
        background: none;
        border-color: var(--hairline-strong);
      }

      .gen-wave,
      .breadcrumb {
        display: none;
      }

      .gen-card {
        box-shadow: none;
        border: 1px solid var(--hairline);
      }

      .gen-card-side {
        background: none;
        color: var(--text-primary);
        border-bottom: 1px solid var(--hairline);
      }

      .gen-card-side .gen-card-label,
      .gen-card-side .gen-card-year,
      .gen-card-side .gen-card-range-label {
        color: var(--text-secondary);
      }

      .gen-card-numeral {
        text-shadow: none;
      }

      .gen-card-range {
        background: none;
        border-color: var(--hairline-strong);
      }

      /* The chip's light values are restated here for gotcha 41's reason: print
         forces the light tokens, but the DARK values are this file's base rule,
         so a dark-theme page would print #fde68a amber-200 names on white paper
         — invisible — and the badge would lose its fill while keeping a pink-200
         text. The gradient is dropped rather than kept: it is a 1,1,3/255
         difference between its two ends (see the block comment above), so
         dropping it costs nothing visually and avoids asking the user to tick
         "background graphics" for two creams that look the same anyway. */
      .gen-legend-chip,
      .gen-legend-chip:hover {
        background: none;
        border-color: var(--hairline-strong);
        color: var(--text-primary);
      }

      .gen-mythical-badge {
        background: none;
        color: var(--text-secondary);
      }
    }
  </style>
</head>
<body>
  <header class="header header-dex">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <!-- A div, not an <h1>: the hero below owns the page's single h1. This is
         the index.html / collections.html pattern, and the reason is gotcha 40 —
         a page must not carry an h1 in the header AND one in its hero. -->
    <a class="header-brand" href="index.html" aria-label="回到寶可夢演算法首頁"><span class="site-logo"><img src="assets/images/logo.png" alt="" width="180" height="180" decoding="async"></span>
      <div class="header-title header-title-large">寶可夢世代指南</div>
    </a>
    <nav class="site-nav" data-nav aria-label="主選單"></nav>
    <button class="site-nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="開啟選單"></button>
    <div class="site-nav-drawer" data-nav data-nav-drawer hidden></div>
  </header>

  <main class="gen-page">
    <nav class="breadcrumb" aria-label="麵包屑導覽">
      <a href="index.html">首頁</a>
      <span class="sep" aria-hidden="true">›</span>
      <a href="pokedex.html">完整圖鑑</a>
      <span class="sep" aria-hidden="true">›</span>
      <span aria-current="page">世代指南</span>
    </nav>

    <section class="gen-hero" aria-labelledby="gen-hero-title">
      <h1 class="gen-hero-title" id="gen-hero-title">寶可夢世代指南</h1>
      <p class="gen-hero-lede">涵蓋所有 9 個寶可夢世代的綜合百科全書。探索每個時代的歷史、獨特機制、傳說寶可夢和特徵。</p>
      <p class="gen-hero-span">從關都 (1996) 到帕底亞 (2022) — 26 年的寶可夢進化史</p>
      <ul class="gen-hero-stats">
        <li><strong id="stat-gens">9</strong><span>世代</span></li>
        <li><strong id="stat-pokemon">1,025</strong><span>寶可夢總數</span></li>
        <li><strong id="stat-regions">9</strong><span>地區</span></li>
        <li><strong id="stat-years">26+</strong><span>歷史 (年)</span></li>
      </ul>
      <svg class="gen-wave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path d="M321.39 56.44c58-10.79 114.16-30.13 172-41.86 82.39-16.72 168.19-17.73 250.45-.39C823.78 31 906.67 72 985.66 92.83c70.05 18.48 146.53 26.09 214.34 3V120H0V95.8C67.3 64.84 144.26 61.14 221.39 56.44Z"/>
      </svg>
    </section>

    <div class="gen-section-head">
      <h2>寶可夢的進化</h2>
      <p>每個世代都為寶可夢世界帶來了革命性的變化。探索定義每個時代的獨特功能、傳說寶可夢和遊戲機制。</p>
    </div>

    <p class="loading-text" id="gen-loading">讀取世代資料中…</p>
    <div class="gen-list" id="gen-list"></div>
  </main>

  <p class="footer-note">寶可夢資料來自 PokeAPI 與官方寶可夢圖鑑・共 1,025 隻</p>

  <script type="module">
    import {
      ASSETS,
      TYPE_EN_ZH,
      loadPokemonData,
      pokemonDetailUrl,
      typeBadgeSmHtml,
      initThemeToggle, initHeaderNav } from './assets/js/shared.js';

    initThemeToggle();
    initHeaderNav();

    const listEl = document.getElementById('gen-list');
    const loadingEl = document.getElementById('gen-loading');

    // TYPE_EN_ZH is keyed by capitalised English and valued in Chinese, but
    // generations.json stores 新屬性 the way the page displays it (惡/鋼/妖精).
    // typeBadgeSmHtml() colours itself from the English key, so the Chinese
    // label has to be walked back to the key rather than passed through.
    function typeSlugFor(zh) {
      const hit = Object.keys(TYPE_EN_ZH).find(k => TYPE_EN_ZH[k] === zh);
      if (!hit) return null;
      return hit.charAt(0).toLowerCase() + hit.slice(1);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // The five outline icons the source puts in its box headings, transcribed
    // rather than swapped for the site's filled set — gotcha 27's rule is that
    // icons are inline SVG sized in `em` and filled with `currentColor`, and
    // these are the one place that does not apply: the source's own tag is
    // `fill="none" stroke="currentColor"`, so they are stroked, not filled, and
    // need their own `fill:none` / `stroke-width` on top of the size. The
    // source puts `stroke-width="2"` on each <path> and `w-4 h-4` (16px) on the
    // <svg>, which is exactly what .gen-box-icon sets.
    //
    // These five paths were extracted per heading — one distinct `d` per
    // heading, cross-checked so no two share. That check is the point: an
    // earlier pass matched icons to headings by proximity and picked up five
    // unrelated lucide paths that also appear elsewhere in that page, all of
    // which looked plausible next to the heading they were attached to. A gear
    // next to 新機制 is not wrong-looking; it is just not the source's icon.
    const GEN_BOX_ICONS = {
      // zap
      mechanics: 'M13 10V3L4 14h7v7l9-11h-7z',
      // puzzle / boxes
      newTypes: 'M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01',
      // gamepad
      games: 'M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z',
      // star
      starters: 'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z',
      // sparkles
      legendary: 'M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z'
    };

    // Returns '' for an unknown key rather than a broken <svg>, so a box without
    // an icon still renders its heading — an icon is never load-bearing.
    function boxIcon(name) {
      const d = GEN_BOX_ICONS[name];
      if (!d) return '';
      return `<svg class="gen-box-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${d}"/></svg>`;
    }

    // The heading and its icon are emitted together so the two can never drift
    // apart. `.gen-box h3` is a flex row with an 8px gap, so the SVG is a flex
    // item and needs no wrapper.
    function boxHeading(label, icon) {
      return `<h3>${boxIcon(icon)}${escapeHtml(label)}</h3>`;
    }

    function chipList(items, cls) {
      return `<ul class="chip-list">${items
        .map(i => `<li class="chip ${cls}">${escapeHtml(i)}</li>`)
        .join('')}</ul>`;
    }

    // #494 is padded, not #0494 — the Pokédex number is a national index, and
    // the site's own formatPokemonId() is what every other page uses.
    function rangeLabel(ids) {
      return `#${String(ids[0]).padStart(3, '0')} – #${String(ids[ids.length - 1]).padStart(3, '0')}`;
    }

    // Starters are linked, not captioned: a starter that goes nowhere is a
    // caption. The sprite is `alt=""` because the name beside it is the label —
    // the same reason the chips below are. Three per generation, always, so
    // flex is enough and a grid would only stretch the first one away.
    function renderStarters(generation, byId) {
      const cells = generation.starters
        .map(id => byId.get(id))
        .filter(Boolean)
        .map(p => `<li>
            <a href="${pokemonDetailUrl(p)}">
              <span class="starter-art"><img src="${ASSETS.images}${p.filename}" alt="" loading="lazy" width="48" height="48"></span>
              <span class="starter-name">${escapeHtml(p.names.zh)}</span>
            </a>
          </li>`);
      return `<section class="gen-box">
          ${boxHeading('最初的夥伴', 'starters')}
          <ul class="starter-list">${cells.join('')}</ul>
        </section>`;
    }

    // 傳說 and 幻之 are one flat cloud, the way the source shows them: a single
    // `flex flex-wrap gap-3` holding both categories, with the mythical carrying
    // a pink 幻之寶可夢 badge. They used to be two labelled rows on the argument
    // that a merged list "would not say which was which" — but the badge says
    // it per item, which is strictly more information than a row label gave, and
    // it is what the source does with the same 1-vs-4 split in gen 1.
    //
    // Order is legendary then mythical, matching the source's gen 1 box
    // (Articuno/Zapdos/Moltres/Mewtwo, then Mew). Two filter() calls rather than
    // one sort, because the badge has to be decided per record anyway and this
    // puts the two populations in a fixed order instead of relying on the order
    // the data happens to arrive in.
    //
    // The chips carry the sprite and the name, where the source has exactly that.
    // `byId` is not needed: `members` is already the resolved record for this
    // generation, so `p.filename` and `p.names.zh` come off it directly. The
    // number that used to lead each chip is gone — see the CSS comment on
    // .gen-legend-chip for why the accent panel makes it redundant.
    function renderLegendary(members) {
      const list = [
        ...members.filter(p => p.is_legendary),
        ...members.filter(p => p.is_mythical),
      ];
      const body = list.length
        ? `<div class="gen-legend-cloud">${list.map(p => `<a class="gen-legend-chip" href="${pokemonDetailUrl(p)}"><img src="${ASSETS.images}${p.filename}" alt="" loading="lazy" width="32" height="32"><span>${escapeHtml(p.names.zh)}</span>${p.is_mythical ? '<span class="gen-mythical-badge">幻之寶可夢</span>' : ''}</a>`).join('')}</div>`
        : '<p class="gen-legend-empty">本代無</p>';
      return `<section class="gen-box">
          ${boxHeading('傳說 & 幻之寶可夢', 'legendary')}
          ${body}
        </section>`;
    }

    // Three named rows, not one auto-flow grid — see the .gen-row CSS comment
    // for why the optional 新屬性 box cannot be placed by auto-flow. Row 3 is
    // full width on both breakpoints: at 768px+ it is the only box in its row,
    // so `repeat(2, ...)` would leave an empty track, and the chip cloud
    // underneath 傳說/幻之 needs the width more than a sibling would.
    function renderCard(generation, members, byId) {
      const ids = members.map(p => p.id).sort((a, b) => a - b);
      const count = ids.length;
      const newTypes = generation.newTypes || [];

      const newTypesBox = newTypes.length ? `<section class="gen-box gen-box-newtypes">
          ${boxHeading('新屬性', 'newTypes')}
          <ul class="chip-list">${newTypes.map(zh => {
            const slug = typeSlugFor(zh);
            return `<li>${slug ? typeBadgeSmHtml(slug, zh) : `<span class="chip chip-newtype">${escapeHtml(zh)}</span>`}</li>`;
          }).join('')}</ul>
        </section>` : '';

      return `<article class="gen-card" data-gen="${generation.gen}" aria-labelledby="gen-card-name-${generation.gen}">
        <div class="gen-card-side">
          <span class="gen-card-label">世代</span>
          <h2 class="gen-card-name" id="gen-card-name-${generation.gen}">
            <span class="sr-only">第 ${generation.gen} 世代・${escapeHtml(generation.region)}・${generation.year}</span>
            <span class="gen-card-numeral" aria-hidden="true">${escapeHtml(generation.numeral)}</span>
            <span class="gen-card-region" aria-hidden="true">${escapeHtml(generation.region)}</span>
          </h2>
          <p class="gen-card-year">${generation.year}</p>
          <div class="gen-card-range">
            <span class="gen-card-range-label">全國圖鑑</span>
            <span class="gen-card-range-value">${rangeLabel(ids)}</span>
            <p class="gen-card-count">${count} 隻新寶可夢</p>
          </div>
        </div>
        <div class="gen-card-body">
          <p class="gen-card-desc">${escapeHtml(generation.description)}</p>
          <div class="gen-row">
            <section class="gen-box">
              ${boxHeading('新機制', 'mechanics')}
              ${chipList(generation.mechanics, 'chip-mechanic')}
            </section>
            ${newTypesBox}
          </div>
          <div class="gen-row">
            <section class="gen-box">
              ${boxHeading('主要遊戲', 'games')}
              ${chipList(generation.games, 'chip-game')}
            </section>
            ${renderStarters(generation, byId)}
          </div>
          <div class="gen-row">
            ${renderLegendary(members)}
          </div>
          <a class="gen-card-cta" href="pokedex.html?gen=${generation.gen}">查看所有 ${count} 隻寶可夢</a>
        </div>
      </article>`;
    }

    // The hero's four tiles are derived, not typed in: 1,025 has appeared in a
    // <strong> on four other pages and 9 is generations.json's own length, so
    // hardcoding them here would be a fifth place to forget to update. The year
    // span is max(year) - min(year) over the same data, which is where 26+
    // comes from — the source page's own stat, and why the first generation
    // being 1996 matters to the arithmetic.
    function renderHeroStats(generations, totalPokemon) {
      const years = generations.map(g => Number(g.year));
      const span = Math.max(...years) - Math.min(...years);
      document.getElementById('stat-gens').textContent = generations.length;
      document.getElementById('stat-pokemon').textContent = totalPokemon.toLocaleString('en-US');
      document.getElementById('stat-regions').textContent = new Set(generations.map(g => g.region)).size;
      document.getElementById('stat-years').textContent = `${span}+`;
    }

    async function init() {
      let generations;
      let allPokemon;
      try {
        const [gensRes, data] = await Promise.all([
          fetch(ASSETS.generations),
          loadPokemonData()
        ]);
        if (!gensRes.ok) {
          throw new Error(`generations.json: HTTP ${gensRes.status}`);
        }
        generations = await gensRes.json();
        allPokemon = data;
      } catch (err) {
        loadingEl.remove();
        listEl.innerHTML = `<p class="gen-error">
            世代資料載入失敗：${escapeHtml(err.message)}<br>
            本頁需要經由 HTTP 伺服器開啟，直接以 file:// 開啟會被瀏覽器阻擋。
          </p>`;
        return;
      }

      if (!Array.isArray(generations) || !generations.length) {
        loadingEl.remove();
        listEl.innerHTML = '<p class="gen-error">generations.json 內容格式不符預期。</p>';
        return;
      }

      const byId = new Map(allPokemon.map(p => [p.id, p]));
      const groups = generations
        .slice()
        .sort((a, b) => a.gen - b.gen)
        .map(g => ({
          generation: g,
          members: allPokemon.filter(p => p.generation === g.gen)
        }));

      // A generation with no members would render an empty range and a "查看
      // 所有 0 隻" link, both of which read as a bug rather than as a data gap.
      const empty = groups.filter(g => !g.members.length);
      if (empty.length) {
        console.warn('generations with no Pokémon in pokemon_data.json:',
          empty.map(g => g.generation.gen).join(', '));
      }

      renderHeroStats(generations, allPokemon.length);
      listEl.innerHTML = groups
        .map(g => renderCard(g.generation, g.members, byId))
        .join('');
      loadingEl.remove();
    }

    init();
  </script>
</body>
</html>
