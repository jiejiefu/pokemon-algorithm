<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1025 全國寶可夢圖鑑</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png">
  <meta name="theme-color" content="#0b1020">
  <!-- Pre-paint theme resolver. Generated from scripts/lib/theme-init.mjs by
       scripts/sync_theme_init.mjs; the rationale is AGENTS.md §3.C. -->
  <script>
    (function () {
      var THEME_KEY = 'pokemon-theme';
      var theme = null;
      try {
        theme = localStorage.getItem(THEME_KEY);
      } catch (e) { /* private mode / storage disabled: resolve from the OS instead */ }
      if (theme !== 'light' && theme !== 'dark') {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
        theme = mq && mq.matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0b1020');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/pokedex.css">
</head>
<body>
  <header class="header header-dex">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <a class="header-brand" href="index.html" aria-label="回到寶可夢演算法首頁"><span class="site-logo"><img src="assets/images/logo.png" alt="" width="180" height="180" decoding="async"></span>
      <!-- A div, not an <h1>: the header title is the site brand (寶可夢演算法)
           on every page, so the page's own <h1> lives in the content area below.
           Two h1s on one page remains the one combination that appears nowhere
           in the site. -->
      <div class="header-title header-title-large">寶可夢演算法</div>
    </a>
    <nav class="site-nav" data-nav aria-label="主選單"></nav>
    <button class="site-nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="開啟選單"></button>
    <div class="site-nav-drawer" data-nav data-nav-drawer hidden></div>
  </header>

  <!-- The page's single h1. Same structure as gen-hero (generations.html) and
     coll-hero (collections.html) — both are transcriptions of InfoPoke's pokedex
     hero, so this is the third instance of one pattern, not a new layout. The
     gradient is the same HUE PATH as InfoPoke's blue→purple→pink but stepped down
     to -600/-700: InfoPoke's own -500 stops measure 4.43:1 for the lede and 3.58:1
     for a stat label under a black/10 scrim, so a verbatim copy fails WCAG AA.
     These stops measure 5.11:1 and 5.32:1 at their lightest. See the block
     comment on .dex-hero below. -->
  <section class="dex-hero" aria-labelledby="dex-hero-title">
    <h1 class="dex-hero-title" id="dex-hero-title">1025 全國寶可夢圖鑑</h1>
    <p class="dex-hero-lede">1,025 隻寶可夢的完整圖鑑，涵蓋 9 個世代、18 種屬性。</p>
    <p class="dex-hero-span">從關都 (1996) 到帕底亞 (2022) — 26 年的寶可夢進化史</p>
    <!-- A <ul>, like gen-hero: these four numbers are a list of facts about the
         page, and a <ul>/<li> says so where a grid of <div>s would not. The "—"
         is deliberate — a number only lands here once it is real, so a tile can
         never show a placeholder that turns out to be wrong. -->
    <ul class="dex-hero-stats">
      <li><strong id="dex-stat-total">—</strong><span>寶可夢總數</span></li>
      <li><strong id="dex-stat-gens">—</strong><span>世代</span></li>
      <li><strong id="dex-stat-types">—</strong><span>屬性</span></li>
      <li><strong id="dex-stat-legendary">—</strong><span>傳說＋幻之</span></li>
    </ul>
  </section>

  <div class="search-controls">
    <input type="text" id="searchInput" class="search-input" 
           placeholder="搜尋編號、中文、英文、日文名稱..." 
           list="pokemon-suggestions" autocomplete="off">
    <datalist id="pokemon-suggestions"></datalist>
  </div>

  <div class="filter-group">
    <select id="typeFilter" class="filter-select">
      <option value="all">所有屬性</option>
    </select>
    <select id="colorFilter" class="filter-select">
      <option value="all">所有顏色</option>
      <option value="red">紅色</option>
      <option value="blue">藍色</option>
      <option value="green">綠色</option>
      <option value="yellow">黃色</option>
      <option value="purple">紫色</option>
      <option value="pink">粉色</option>
      <option value="brown">棕色</option>
      <option value="black">黑色</option>
      <option value="white">白色</option>
      <option value="gray">灰色</option>
    </select>
    <button id="clearFilters" class="filter-select" style="background:var(--accent-gold);color:var(--on-accent);border:none;font-weight:bold;">清除篩選</button>
  </div>

  <!-- Generation filter. The buttons are built by renderGenFilters() from
       GEN_FILTERS rather than written out here, so the region name, the dex
       range in the title, and the set of values ?gen= accepts all come from one
       array and cannot drift apart. This shell is what remains without JS: a
       labelled, empty group. -->
  <div class="gen-filter-bar" role="group" aria-labelledby="gen-filter-label">
    <span class="gen-filter-label" id="gen-filter-label">按寶可夢世代篩選</span>
  </div>

  <div class="filter-extras">
    <span class="filter-extras-label">依色盤瀏覽：</span>
    <!-- The single-Pokemon page is not linked from here — it needs a slug, so it
         is reached from a card. All three colour pages are in the header's 色彩
         trigger regardless; this row is a convenience, not the only way in. -->
    <a class="filter-link" href="colors-explore.html">色彩探索</a>
    <a class="filter-link" href="colors-generator.html">色彩生成器</a>
  </div>

  <div class="results-info" id="resultsInfo">載入中...</div>

  <div id="loading" class="loading-text">讀取圖鑑資料中...</div>
  <div id="pokedex-grid" class="pokedex-grid"></div>

  <script type="module">
    import {loadPokemonData, createPokemonCard, pokemonDetailUrl, TYPE_EN_ZH, initThemeToggle, initHeaderNav } from './assets/js/shared.js';
    // Wire the theme toggle before anything else. Module scripts are deferred, so
    // the DOM is already parsed here and the button in the header is present.
    initThemeToggle();
    initHeaderNav('pokedex.html');

    const grid = document.getElementById('pokedex-grid');
    const loading = document.getElementById('loading');
    const searchInput = document.getElementById('searchInput');
    const datalist = document.getElementById('pokemon-suggestions');
    const typeFilter = document.getElementById('typeFilter');
    const colorFilter = document.getElementById('colorFilter');
    const genFilterBar = document.querySelector('.gen-filter-bar');
    const clearBtn = document.getElementById('clearFilters');
    const resultsInfo = document.getElementById('resultsInfo');
    
    let allPokemonData = [];

    /* The nine generations, in one place. This array is the ONLY source for the
       buttons' labels, their region names, the dex range in each `title`, and
       the set of values `?gen=` accepts — previously those were a <select>'s ten
       <option>s, the string regex /^[1-9]$/, and InfoPoke's own markup, none of
       which could see each other. Deriving the validator from the array means a
       tenth generation cannot be added to the UI while the deep-link still
       rejects it.

       `range` is the national-dex span, copied from the source row
       (infopoke_net_pokemon.html:353) and verified against
       assets/data/pokemon_data.json: min/max id per generation is
       1-151, 152-251, 252-386, 387-493, 494-649, 650-721, 722-809, 810-905,
       906-1025. It is tooltip text, not a filter input — the filter runs on
       `pokemon.generation`, never on an id comparison — so a range that drifts
       would be a cosmetic lie in a tooltip rather than wrong results. */
    const GEN_FILTERS = [
      { gen: 1, region: '關都',   range: '#1-#151'   },
      { gen: 2, region: '城都',   range: '#152-#251' },
      { gen: 3, region: '豐緣',   range: '#252-#386' },
      { gen: 4, region: '神奧',   range: '#387-#493' },
      { gen: 5, region: '合眾',   range: '#494-#649' },
      { gen: 6, region: '卡洛斯', range: '#650-#721' },
      { gen: 7, region: '阿羅拉', range: '#722-#809' },
      { gen: 8, region: '伽勒爾', range: '#810-#905' },
      { gen: 9, region: '帕底亞', range: '#906-#1025' },
    ];

    // `selectedGen` replaces the <select>'s `.value`. 'all' is the reset state,
    // not a member of GEN_FILTERS, which is why the checks below are written as
    // "is this a known generation" rather than "is this in the array".
    let selectedGen = 'all';

    /* Builds the row. Two spans per generation button, stacked, the way the
       source stacks them (infopoke_net_pokemon.html:353): the number is what a
       reader scans for, the region is what they remember the generation by. The
       region span is hidden by CSS below `lg`, not omitted, so the button keeps
       its identity at every width.

       textContent throughout, never innerHTML: these strings are content and
       every other renderer in this file treats them that way. */
    function renderGenFilters() {
      const frag = document.createDocumentFragment();

      // "All" is a peer of the nine, not a member of them — a reset is a
      // different kind of act from a choice, and it has no region line, which is
      // what tells the two apart at a glance.
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'gen-filter gen-filter-all';
      all.dataset.gen = 'all';
      all.textContent = '所有世代';
      all.setAttribute('aria-label', '所有世代');
      frag.appendChild(all);

      const divider = document.createElement('span');
      divider.className = 'gen-filter-divider';
      divider.setAttribute('aria-hidden', 'true');
      frag.appendChild(divider);

      for (const g of GEN_FILTERS) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gen-filter';
        btn.dataset.gen = String(g.gen);
        btn.title = `第 ${g.gen} 世代: ${g.region} (${g.range})`;
        btn.setAttribute('aria-label', `第 ${g.gen} 世代 - ${g.region}`);

        const name = document.createElement('span');
        name.textContent = `第 ${g.gen} 世代`;
        const region = document.createElement('span');
        region.className = 'gen-filter-region';
        region.textContent = g.region;
        btn.append(name, region);

        frag.appendChild(btn);
      }

      genFilterBar.appendChild(frag);
    }

    /* One place that writes the pressed state, so the row cannot disagree with
       `selectedGen`. Called after a click, after clearFilters(), and once the
       deep-link below has been resolved. */
    function syncGenButtons() {
      for (const btn of genFilterBar.querySelectorAll('.gen-filter')) {
        btn.setAttribute('aria-pressed', String(btn.dataset.gen === selectedGen));
      }
    }

    renderGenFilters();

    // generations.html and detail.html deep-link here as pokedex.html?gen=N. The
    // value is validated against GEN_FILTERS before it becomes state because a
    // hand-edited or stale link can carry anything, and showing the unfiltered
    // 1025 while the URL claims a generation is a claim the page cannot back.
    // The application is deliberately NOT here: filterPokedex() needs
    // allPokemonData, so the param is applied once the fetch resolves below.
    const genParam = new URLSearchParams(location.search).get('gen');
    if (genParam && GEN_FILTERS.some(g => String(g.gen) === genParam)) {
      selectedGen = genParam;
    }
    syncGenButtons();

    // Keep ?gen= in the address bar so a filtered view can be shared or
    // reloaded. replaceState, not pushState: this is a refinement of the view
    // the user is already on, not a navigation they should have to go back to.
    function syncUrl() {
      const url = new URL(location.href);
      if (selectedGen === 'all') {
        url.searchParams.delete('gen');
      } else {
        url.searchParams.set('gen', selectedGen);
      }
      history.replaceState(null, '', url);
    }

    /* The hero's four tiles. Every number is derived from the array already in
       hand — no second fetch, which is the same move .gen-hero makes. That also
       means the lede and the span above the tiles, which quote 1,025 / 9 / 18 in
       prose, cannot drift from the tiles: if the dataset ever changes, the
       counts move together and the static text is what needs revisiting.

       傳說＋幻之 is one tile, not two: .dex-hero-stats is a 4-column grid at every
       breakpoint above 640px, and five tiles would leave an orphan on its own
       row. 幻之 is this site's word for mythical everywhere else — the
       colors-explore facet list pairs 傳說/幻之 and index.html's quick link says
       幻之寶可夢. is_legendary and is_mythical are separate booleans in
       pokemon_data.json (71 and 23 respectively, 94 together). */
    function renderHeroStats() {
      const gens = new Set(allPokemonData.map(p => p.generation)).size;
      const tiles = {
        'dex-stat-total': allPokemonData.length.toLocaleString('en-US'),
        'dex-stat-gens': gens,
        // TYPE_EN_ZH is the site's own 18-key map, already imported above for the
        // filter dropdown, so the tile and the dropdown cannot disagree on how
        // many types there are.
        'dex-stat-types': Object.keys(TYPE_EN_ZH).length,
        'dex-stat-legendary': allPokemonData.filter(p => p.is_legendary || p.is_mythical).length,
      };
      for (const [id, value] of Object.entries(tiles)) {
        document.getElementById(id).textContent = value;
      }
    }

    async function fetchPokedex() {
      try {
        allPokemonData = await loadPokemonData();
        loading.style.display = 'none';

        renderHeroStats();

        // Populate datalist for autocomplete
        populateDatalist();
        
        // Populate type filter
        populateTypeFilter();
        
        // filterPokedex(), not renderGrid(allPokemonData): with every control at
        // its default this is the same call, and it is the only one that honours
        // a ?gen= in the URL. Calling it here rather than at parse time is the
        // whole reason the param is stored above instead of applied.
        filterPokedex();
      } catch (error) {
        loading.innerText = '載入失敗，請確認是否使用 Local Server 開啟。';
        console.error(error);
      }
    }

    function populateDatalist() {
      datalist.innerHTML = '';
      allPokemonData.forEach(p => {
        const names = [
          String(p.id),
          p.names?.zh,
          p.names?.zh_HK,
          p.names?.en,
          p.names?.ja
        ].filter(Boolean);
        
        names.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          datalist.appendChild(option);
        });
      });
    }

    function populateTypeFilter() {
      // Get all unique types from data
      const typeSet = new Set();
      allPokemonData.forEach(p => {
        if (p.types) p.types.forEach(t => typeSet.add(t));
      });
      
      const sortedTypes = Array.from(typeSet).sort();
      
      sortedTypes.forEach(t => {
        const zh = TYPE_EN_ZH[t] || t;
        const option = document.createElement('option');
        option.value = t;
        option.textContent = `${zh} (${t})`;
        typeFilter.appendChild(option);
      });
    }

    function renderGrid(dataArray) {
      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();
      
      dataArray.forEach(pokemon => {
        fragment.appendChild(createPokemonCard(pokemon, {
          onClick: (id) => window.location.href = pokemonDetailUrl(dataArray.find(pokemon => pokemon.id === id)),
          showTypes: true
        }));
      });
      
      grid.appendChild(fragment);
      updateResultsInfo(dataArray.length);
    }

    function updateResultsInfo(count) {
      resultsInfo.textContent = `顯示 ${count} / ${allPokemonData.length} 隻寶可夢`;
    }

    function filterPokedex() {
      const searchText = searchInput.value.toLowerCase().trim();
      const selectedType = typeFilter.value;
      const selectedColor = colorFilter.value;
      // No local `selectedGen` here on purpose. There was one, reading the
      // <select>'s .value, and it shadowed the module-level state the buttons
      // write -- so renaming the state alone would have compiled and then
      // filtered on a stale copy. The outer variable is the single source.

      const filteredData = allPokemonData.filter(pokemon => {
        // Search match
        let matchSearch = true;
        if (searchText) {
          const idMatch = String(pokemon.id).includes(searchText);
          const zhMatch = pokemon.names?.zh?.toLowerCase().includes(searchText);
          const zhHKMatch = pokemon.names?.zh_HK?.toLowerCase().includes(searchText);
          const enMatch = pokemon.names?.en?.toLowerCase().includes(searchText);
          const jaMatch = pokemon.names?.ja?.includes(searchText);
          matchSearch = idMatch || zhMatch || zhHKMatch || enMatch || jaMatch;
        }

        // Type match
        let matchType = true;
        if (selectedType !== 'all' && pokemon.types) {
          matchType = pokemon.types.includes(selectedType);
        }

        // Color match (using PokeAPI color)
        let matchColor = true;
        if (selectedColor !== 'all') {
          matchColor = pokemon.color?.toLowerCase() === selectedColor;
        }

        // Generation match
        let matchGen = true;
        if (selectedGen !== 'all') {
          matchGen = pokemon.generation == parseInt(selectedGen);
        }

        return matchSearch && matchType && matchColor && matchGen;
      });

      renderGrid(filteredData);
    }

    function clearFilters() {
      searchInput.value = '';
      typeFilter.value = 'all';
      colorFilter.value = 'all';
      selectedGen = 'all';
      // The buttons are visible state, not a readout of the grid: without this
      // the row would still show the pressed generation while the unfiltered
      // 1025 were back on screen, which is the same unbacked claim the
      // deep-link guard above exists to prevent.
      syncGenButtons();
      renderGrid(allPokemonData);
      syncUrl();
    }

    // Event listeners
    searchInput.addEventListener('input', filterPokedex);
    typeFilter.addEventListener('change', filterPokedex);
    colorFilter.addEventListener('change', filterPokedex);
    /* One delegated listener on the row, not one per button. The buttons are
       built in JS, so binding at load time would miss them; and a delegated
       handler is the only version that survives the row being re-rendered.

       Only a generation click writes the URL — doing it from filterPokedex()
       would rewrite the address bar on every keystroke in the search box.

       `closest` rather than iterating: the click target for a two-span button is
       the SPAN, not the button, and ten buttons x two spans is exactly the shape
       where event.target is the wrong node. */
    genFilterBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.gen-filter');
      if (!btn) return;
      selectedGen = btn.dataset.gen;
      syncGenButtons();
      filterPokedex();
      syncUrl();
    });
    clearBtn.addEventListener('click', clearFilters);

    // Allow Enter key on search to focus first result
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchInput.value) {
        // Optionally navigate to first match
      }
    });

    window.onload = fetchPokedex;
  </script>
</body>
</html>
