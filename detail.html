<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">

<body>
  <header class="header header-detail">
    <div class="header-inner">
        <div class="header-title" style="font-size:18px;">寶可夢圖鑑詳細資料</div>
      <a href="index.html" class="btn btn-nav header-back">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
        返回大廳
      </a>
    </div>
  </header>

  <main class="detail-container">
    <div id="detail-loading" class="notice" role="status" aria-live="polite">
      載入寶可夢資料中...
    </div>

    <div id="detail-error" class="notice" hidden>
      <h2>找不到此寶可夢</h2>
      <p>可能是編號錯誤或資料尚未載入</p>
      <a href="index.html" class="btn btn-nav">返回大廳</a>
    </div>

    <div id="detail-content" hidden>
      <!-- Top card: identity | names + profile + abilities | breeding -->
      <section class="top-hero-card" id="top-hero-card" aria-labelledby="pokemon-name-zh">
        <div class="hero-grid">

          <div class="hero-col-left">
            <button type="button" class="shiny-btn" id="shiny-toggle" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
              <span class="sr-only">切換閃亮外觀</span>
            </button>

            <h1 class="hero-title" id="pokemon-name-zh">—</h1>
            <p class="hero-subtitle">
              <span class="hero-id" id="pokemon-id">#0001</span>
              <span class="hero-title-en" id="pokemon-name-en">—</span>
            </p>

            <div class="sprite-frame" id="sprite-frame">
              <span class="sprite-glow" aria-hidden="true"></span>
              <img id="pokemon-sprite" src="" alt="" loading="eager" decoding="async" width="475" height="475">
            </div>

            <div class="type-badges" id="type-badges"></div>

            <nav class="hero-pager" aria-label="寶可夢瀏覽">
              <a class="pager-link" id="pokemon-prev" rel="prev">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
                <span>上一隻</span>
              </a>
              <a class="pager-link" id="pokemon-next" rel="next">
                <span>下一隻</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4 4.6-4.6z"/></svg>
              </a>
            </nav>
          </div>

          <div class="info-card">
            <section class="info-group" aria-labelledby="grp-names">
              <h2 class="group-title" id="grp-names">名字</h2>
              <ul class="names-grid" id="pokemon-names-row"></ul>
            </section>

            <section class="info-group" aria-labelledby="grp-profile">
              <h2 class="group-title" id="grp-profile">檔案</h2>
              <div class="fact-grid" id="fact-grid"></div>
            </section>

            <section class="info-group" aria-labelledby="grp-abilities">
              <h2 class="group-title" id="grp-abilities">特性</h2>
              <div class="chip-row" id="ability-chips"></div>
            </section>
          </div>

          <div class="info-card">
            <div class="breed-split">
              <section class="info-group" aria-labelledby="grp-breeding">
                <h2 class="group-title" id="grp-breeding">培育</h2>
                <div class="fact-rows" id="breeding-list"></div>
              </section>

              <section class="info-group" aria-labelledby="grp-egg">
                <h2 class="group-title" id="grp-egg">生蛋</h2>
                <div class="fact-rows" id="egg-list"></div>
              </section>
            </div>
          </div>

        </div>
      </section>

      <!-- Stats -->
      <section class="section" aria-labelledby="stats-title">
        <div class="section-head">
          <h2 class="section-title" id="stats-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
            能力數值
          </h2>
          <span class="section-note" id="stats-note">各項能力以 255 為滿值，能力總和以 720 為滿值</span>
        </div>
        <div class="stats-layout">
          <div class="radar-frame">
            <canvas id="radar-chart" role="img" aria-label="能力值雷達圖"></canvas>
          </div>
          <div class="stat-bars" id="stat-bars"></div>
        </div>
      </section>

      <!-- Type effectiveness -->
      <section class="section" aria-labelledby="eff-title">
        <div class="section-head">
          <h2 class="section-title" id="eff-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6zm0 5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5m0 8.5c-1.4 0-2.5-.6-2.5-1.3 0-.6.5-1 1.4-1.3l1.1-.3 1.1.3c.9.3 1.4.7 1.4 1.3 0 .7-1.1 1.3-2.5 1.3"/></svg>
            屬性相剋
          </h2>
          <span class="section-note">雙屬性倍率相乘</span>
        </div>
        <div class="eff-buckets" id="type-effectiveness"></div>
        <p class="eff-source" id="eff-source"></p>
      </section>

      <!-- Evolution -->
      <section class="section" aria-labelledby="evo-title">
        <div class="section-head">
          <h2 class="section-title" id="evo-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3h4v2H9v3H7zm6 0h4v5h-2V5h-2zM5 10h6v2H5zm8 0h6v2h-6zM7 17h4v2H7zm6 0h4v4h-2v-2h-2z"/></svg>
            進化鏈
          </h2>
          <span class="section-note" id="evo-note"></span>
        </div>
        <div id="evolution-chain"></div>
      </section>

      <!-- Moves -->
      <section class="section" aria-labelledby="moves-title" id="moves-section">
        <div class="section-head">
          <h2 class="section-title" id="moves-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3 4 13h6l-2 8 10-10h-6z"/></svg>
            招式
          </h2>
          <span class="section-note" id="moves-note">載入中…</span>
        </div>
        <div id="move-section"></div>
      </section>

      <!-- Descriptions -->
      <section class="section" aria-labelledby="desc-title">
        <div class="section-head">
          <h2 class="section-title" id="desc-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h9l5 5v13H5zm2 2v14h10V9h-4V5z"/></svg>
            圖鑑描述
          </h2>
        </div>
        <div id="description-content"></div>
      </section>

      <nav class="detail-footer" aria-label="寶可夢瀏覽">
        <a class="pager-link" id="pokemon-prev-foot" rel="prev">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
          <span>上一隻</span>
        </a>
        <a class="pager-link" id="pokemon-next-foot" rel="next">
          <span>下一隻</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4 4.6-4.6z"/></svg>
        </a>
      </nav>
    </div>
  </main>

  <script type="module">
    import {
      loadPokemonData, ASSETS, formatPokemonId, pokemonSlug, pokemonDetailPath,
      pokemonDetailUrl, loadEvolutionChain, renderEvolutionChain,
      loadLearnsets, loadMoveDefs, renderMoveSection, typeBadgeHtml
    } from './assets/js/shared.js';
    import {
      TYPE_EN_ZH, TYPE_COLORS, SHAPE_ZH, HABITAT_ZH, GROWTH_RATE_ZH, EGG_GROUP_ZH,
      COLOR_ZH, STAT_KEYS, STAT_MAX, TOTAL_MAX, STAT_LABELS, EFFECT_BUCKETS, TYPE_CHART_SOURCE,
      typeEffectiveness, genusZh, labelZh
    } from './assets/js/pokemon-lexicon.js';

    // 繁體 is the hero h1, so it is deliberately absent here; the other eight
    // render for all 1025 Pokemon, including the 359 whose simplified name is
    // character-for-character identical to the traditional one, so that the
    // badge row is the same length on every page.
    // Only the *alternate* names belong here. The hero already shows the two
    // primary ones at full size: names.zh is the <h1> and names.en sits under
    // it in .hero-title-en, so an 英文 badge repeated it verbatim.
    // es/it are absent for the same reason - for 1005 of 1025 they are a
    // character-for-character copy of names.en, which made the row read as
    // padding. The data stays in pokemon_data.json because 20 es and 21 it
    // names ARE real translations (Iron Thorns -> Ferropúas / Spineferree),
    // so re-adding these two lines is all it takes to bring them back.
    const NAMES = [
      { lang: '簡體', key: 'zh_HK' },
      { lang: '日文', key: 'ja' },
      { lang: '法文', key: 'fr' },
      { lang: '德文', key: 'de' },
      { lang: '韓文', key: 'ko' }
    ];

    // WCAG relative luminance / contrast, used only for the colour swatch.
    const toLinear = v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    const luminance = ([r, g, b]) => 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    const contrast = (a, b) => {
      const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
      return (hi + 0.05) / (lo + 0.05);
    };

    /**
     * The colour swatch fill comes from the Pokémon's own RGB, but for mid-tone
     * colours neither white nor near-black text reaches 4.5:1 against it. Pick
     * the better text colour, then scale the fill towards black or white only
     * as far as needed, so the swatch still reads as the Pokémon's colour.
     */
    function badgeStyle(rgb) {
      const LIGHT = [255, 255, 255];
      const DARK = [20, 17, 10];
      const useLightText = contrast(rgb, LIGHT) >= contrast(rgb, DARK);
      const textColor = useLightText ? LIGHT : DARK;
      const towards = useLightText ? [0, 0, 0] : [255, 255, 255];
      let fill = rgb.slice();
      for (let t = 0; t <= 1.0001; t += 0.02) {
        fill = rgb.map((c, i) => Math.round(c + (towards[i] - c) * t));
        if (contrast(fill, textColor) >= 4.5) break;
      }
      return `background:rgb(${fill.join(', ')});color:rgb(${textColor.join(', ')})`;
    }

    let pokemonData = [];
    let currentPokemon = null;

    const el = id => document.getElementById(id);

    async function init() {
      try {
        pokemonData = await loadPokemonData();
        if (!pokemonData.length) throw new Error('empty dataset');

        // `?id=` is the legacy form; `?slug=` and /detail/<slug> are canonical.
        const params = new URLSearchParams(window.location.search);
        const idParam = params.get('id');
        const pathMatch = window.location.pathname.match(/\/detail\/([^/]+)\/?$/);
        const slugParam = params.get('slug') || (pathMatch ? decodeURIComponent(pathMatch[1]) : '');
        const id = idParam ? parseInt(idParam, 10) : NaN;

        currentPokemon = Number.isFinite(id)
          ? pokemonData.find(p => p.id === id)
          : slugParam
            ? pokemonData.find(p => pokemonSlug(p) === slugParam)
            : pokemonData[0];

        if (!currentPokemon) {
          showError();
          return;
        }

        renderDetail();
        el('shiny-toggle').addEventListener('click', toggleShiny);
        if (params.get('from404') === '1') {
          history.replaceState(null, '', pokemonDetailPath(currentPokemon));
        }
        const title = `${currentPokemon.names.zh} (#${formatPokemonId(currentPokemon.id)}) — 寶可夢圖鑑`;
        document.title = title;
        el('page-title').textContent = `${currentPokemon.names.zh} 詳細資料`;
      } catch (error) {
        console.error(error);
        showError();
      }
    }

    function showError() {
      el('detail-loading').hidden = true;
      el('detail-content').hidden = true;
      el('detail-error').hidden = false;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderDetail() {
      const p = currentPokemon;

      el('detail-loading').hidden = true;
      el('detail-content').hidden = false;

      el('pokemon-sprite').src = `${ASSETS.images}${p.filename}`;
      el('pokemon-sprite').alt = `${p.names.zh}（${p.names.en}）`;

      el('pokemon-id').textContent = formatPokemonId(p.id);
      el('pokemon-name-zh').textContent = p.names.zh;
      el('pokemon-name-en').textContent = p.names.en;

      // The card's glass has to refract something, and the page background is a
      // flat #121212, so the card paints its own tinted aurora behind the
      // backdrop-filter. Same convention as createPokemonCard() in shared.js.
      if (Array.isArray(p.rgb) && p.rgb.length === 3) {
        el('top-hero-card').style.setProperty('--card-accent-rgb', p.rgb.join(' '));
      }

      el('type-badges').innerHTML = p.types.map((t, i) => typeBadgeHtml(t, p.types_zh[i])).join('');

      el('pokemon-names-row').innerHTML = NAMES
        .filter(n => p.names[n.key])
        .map(n => `<li><span class="lang">${n.lang}</span><span class="value">${escapeHtml(p.names[n.key])}</span></li>`)
        .join('');

      renderPager(p);
      renderProfile(p);
      renderAbilities(p);
      renderBreeding(p);
      renderStats(p);
      renderEffectiveness(p);
      renderEvolution(p);
      renderMoves(p);
      renderDescriptions(p);
    }

    function renderPager(p) {
      const index = pokemonData.findIndex(entry => entry.id === p.id);
      const prev = index > 0 ? pokemonData[index - 1] : null;
      const next = index >= 0 && index < pokemonData.length - 1 ? pokemonData[index + 1] : null;

      // Hero pager carries the neighbour's name; the footer pager stays terse.
      const setLink = (link, target, label) => {
        if (target) {
          link.href = pokemonDetailUrl(target);
          link.classList.remove('is-disabled');
          link.removeAttribute('aria-disabled');
        } else {
          link.removeAttribute('href');
          link.classList.add('is-disabled');
          link.setAttribute('aria-disabled', 'true');
        }
        const text = link.querySelector('span');
        if (text) text.textContent = label;
      };

      setLink(el('pokemon-prev'), prev, prev ? `上一隻：${prev.names.zh}` : '已是第一隻');
      setLink(el('pokemon-next'), next, next ? `下一隻：${next.names.zh}` : '已是最後一隻');
      setLink(el('pokemon-prev-foot'), prev, '上一隻');
      setLink(el('pokemon-next-foot'), next, '下一隻');
    }

    /**
     * Shiny is a CSS filter placeholder, not real artwork: pokemon_data.json
     * has no shiny sprite URL and none is downloaded yet. PokeAPI keeps the real
     * one at /pokemon/{id} -> other["official-artwork"]["front_shiny"], and
     * files/official-artwork/shiny/{id}.png is the plain artwork variant — so
     * when that lands, this function becomes a src swap and .is-shiny stops
     * setting filter. Until then the button must still report its state, which
     * is why aria-pressed is updated here rather than left to the CSS.
     */
    let shinyOn = false;

    function toggleShiny() {
      shinyOn = !shinyOn;
      el('pokemon-sprite').classList.toggle('is-shiny', shinyOn);
      el('shiny-toggle').classList.toggle('is-active', shinyOn);
      el('shiny-toggle').setAttribute('aria-pressed', String(shinyOn));
    }

    /** One label/value pair, InfoPoke's dense left-right row. */

    function factRow(label, valueHtml) {
      return `<div class="fact"><span class="fact-label">${label}</span><span class="fact-value">${valueHtml}</span></div>`;
    }

    function factText(value) {
      return value === null || value === undefined || value === ''
        ? '<span class="is-muted">—</span>'
        : escapeHtml(String(value));
    }

    /** 檔案 — the identity fields. 分類 spans both columns, as in InfoPoke. */
    function renderProfile(p) {
      const facts = [
        { label: '分類', value: p.genus ? genusZh(p) : null, wide: true },
        { label: '身高', value: p.height_m != null ? `${p.height_m} m` : null },
        { label: '體重', value: p.weight_kg != null ? `${p.weight_kg} kg` : null },
        { label: '基礎經驗值', value: p.base_experience },
        { label: '世代', value: p.generation },
        { label: '棲息地', value: labelZh(HABITAT_ZH, p.habitat) },
        { label: '體型', value: labelZh(SHAPE_ZH, p.shape) },
        { label: '顏色', value: labelZh(COLOR_ZH, p.color), badge: p.rgb }
      ];

      el('fact-grid').innerHTML = facts.map(f => {
        // The swatch keeps the AA-contrast fix in badgeStyle() rather than
        // InfoPoke's plain colour dot: its fill is the Pokémon's own RGB.
        const value = f.badge && Array.isArray(f.badge) && f.badge.length === 3
          ? `<span class="color-badge" style="${badgeStyle(f.badge)}">${escapeHtml(f.value)}</span>`
          : factText(f.value);
        const cls = f.wide ? ' fact-wide' : '';
        return `<div class="fact${cls}"><span class="fact-label">${f.label}</span><span class="fact-value">${value}</span></div>`;
      }).join('');
    }

    /** 特性 — the hidden ability is tagged, as in InfoPoke's purple chip. */
    function renderAbilities(p) {
      const values = p.abilities || [];
      if (!values.length) {
        el('ability-chips').innerHTML = '<span class="is-muted">—</span>';
        return;
      }
      el('ability-chips').innerHTML = values.map(v => {
        const isHidden = p.hidden_ability && v === p.hidden_ability;
        return `<span class="chip${isHidden ? ' is-hidden-ability' : ''}">${escapeHtml(v)}${isHidden ? ' · 隱藏特性' : ''}</span>`;
      }).join('');
    }

    /**
     * 培育 and 生蛋. gender_rate and hatch_counter come from
     * fetch_breeding_data.py; both are absent on the pre-breeding dataset, so
     * every value is routed through factText() and degrades to a muted —.
     */
    function renderBreeding(p) {
      const breeding = [
        { label: '捕獲率', value: p.capture_rate },
        { label: '基礎親密度', value: p.base_happiness },
        { label: '成長速度', value: labelZh(GROWTH_RATE_ZH, p.growth_rate) }
      ];
      el('breeding-list').innerHTML = breeding
        .map(f => factRow(f.label, factText(f.value)))
        .join('');

      const eggs = [];
      if (typeof p.gender_rate === 'number' && p.gender_rate >= 0) {
        const female = (p.gender_rate / 8) * 100;
        const male = 100 - female;
        // ♂/♀ are U+2642/U+2640 data symbols, the same category as the ones in
        // Nidoran♀/Nidoran♂ — not decorative emoji, so do not "clean" them up.
        const pct = n => `${Number(n.toFixed(1))}%`;
        eggs.push({ label: '性別比例', html: `<span class="gender-male">♂${pct(male)}</span> <span class="gender-female">♀${pct(female)}</span>` });
      } else if (p.gender_rate === -1) {
        eggs.push({ label: '性別比例', html: '無性別' });
      } else {
        eggs.push({ label: '性別比例', html: '<span class="is-muted">—</span>' });
      }

      if (p.hatch_counter > 0) {
        eggs.push({ label: '孵化時間', value: `${p.hatch_counter} 週期` });
      } else {
        eggs.push({ label: '孵化時間', html: '<span class="is-muted">—</span>' });
      }

      const groups = (p.egg_groups || []).map(g => escapeHtml(labelZh(EGG_GROUP_ZH, g)));
      eggs.push({
        label: '蛋群組',
        html: groups.length ? `<span class="egg-groups">${groups.join('、')}</span>` : '<span class="is-muted">—</span>'
      });

      el('egg-list').innerHTML = eggs.map(e => factRow(e.label, e.html || factText(e.value))).join('');
    }

    function renderStats(p) {
      // The note is static markup, so it cannot interpolate the scale constants
      // itself; it is rewritten here to keep them the single source of truth
      // alongside the bars they describe.
      el('stats-note').textContent = `各項能力以 ${STAT_MAX} 為滿值，能力總和以 ${TOTAL_MAX} 為滿值`;

      const bars = STAT_KEYS.map(key => {
        const value = p.stats[key] || 0;
        const pct = Math.max(0, Math.min(100, (value / STAT_MAX) * 100));
        return `
          <div class="stat-row">
            <span class="stat-label">${STAT_LABELS[key]}</span>
            <span class="stat-value">${value}</span>
            <span class="stat-track">
              <span class="stat-fill" style="width:${pct.toFixed(1)}%"></span>
            </span>
          </div>`;
      }).join('');

      el('stat-bars').innerHTML = bars + `
        <p class="stat-total">
          <span class="stat-label stat-total-label">能力總和 / ${TOTAL_MAX}</span>
          <span class="stat-value stat-total-value">${p.stats.total}</span>
          <span class="stat-track">
            <span class="stat-fill stat-total-fill" style="width:${(Math.max(0, Math.min(100, (p.stats.total / TOTAL_MAX) * 100))).toFixed(1)}%"></span>
          </span>
        </p>`;

      drawRadarChart(p.stats);
    }

    function drawRadarChart(stats) {
      const canvas = el('radar-chart');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      // The canvas is fluid in CSS, so size the backing store to its rendered
      // box times devicePixelRatio instead of trusting the width/height attributes.
      const cssWidth = canvas.clientWidth || 320;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(cssWidth * dpr);
      canvas.height = Math.round(cssWidth * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssWidth, cssWidth);

      const center = cssWidth / 2;
      // Leave room for the axis labels that sit outside the outer ring.
      const radius = center - 26;
      const count = STAT_KEYS.length;
      const angleFor = i => (i / count) * Math.PI * 2 - Math.PI / 2;

      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      for (let level = 1; level <= 5; level++) {
        ctx.beginPath();
        ctx.arc(center, center, (radius * level) / 5, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255,221,0,0.3)';
      STAT_KEYS.forEach((key, i) => {
        const angle = angleFor(i);
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.lineTo(center + Math.cos(angle) * radius, center + Math.sin(angle) * radius);
        ctx.stroke();
      });

      // Share the /255 scale with the bars so the two views agree.
      ctx.beginPath();
      STAT_KEYS.forEach((key, i) => {
        const angle = angleFor(i);
        const r = (radius * Math.max(0, Math.min(stats[key] || 0, STAT_MAX))) / STAT_MAX;
        const x = center + Math.cos(angle) * r;
        const y = center + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,221,0,0.3)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,221,0,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '12px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      STAT_KEYS.forEach((key, i) => {
        const angle = angleFor(i);
        ctx.fillText(
          STAT_LABELS[key],
          center + Math.cos(angle) * (radius + 15),
          center + Math.sin(angle) * (radius + 15)
        );
      });
    }

    function renderEffectiveness(p) {
      const buckets = typeEffectiveness(p.types);
      const colors = { 4: '#ff5470', 2: '#ff9f45', 0.5: '#4cc9f0', 0.25: '#7bcf6b', 0: '#ffde00' };

      el('type-effectiveness').innerHTML = buckets.map(bucket => {
        const color = colors[bucket.multiplier] || '#ccc';
        return `
          <div class="eff-bucket">
            <div class="eff-head">
              <span class="eff-mult" style="color:${color}">${escapeHtml(bucket.suffix)}</span>
              <span class="eff-label">${escapeHtml(bucket.label)}</span>
            </div>
            <div class="eff-types">
              ${bucket.types.map(t => {
                const zh = t.zh || TYPE_EN_ZH[t.en] || t.en;
                return `<span class="eff-type" style="background:${TYPE_COLORS[t.en] || '#777'}">${escapeHtml(zh)}</span>`;
              }).join('')}
            </div>
          </div>`;
      }).join('');

      el('eff-source').textContent =
        `倍率來源：${TYPE_CHART_SOURCE.section}，取自 ${TYPE_CHART_SOURCE.url}` +
        `（revid ${TYPE_CHART_SOURCE.revid}，${TYPE_CHART_SOURCE.timestamp.slice(0, 10)}）。` +
        '雙屬性以兩列相乘，1× 的屬性不會列出。';
    }

    function renderEvolution(p) {
      const container = el('evolution-chain');
      el('evo-note').textContent = p.evolution_chain_id ? `鏈 #${p.evolution_chain_id}` : '';

      loadEvolutionChain(p.evolution_chain_id).then(chainData => {
        renderEvolutionChain(container, chainData, p.id);
      }).catch(err => {
        console.error('Failed to load evolution chain:', err);
        container.innerHTML = '<p class="eff-neutral">無法載入進化鏈數據</p>';
      });
    }

    /**
     * learnsets.json is ~940 KB raw, so it is not fetched until the moves
     * section is close to the viewport. Both files are cached on window by
     * loadLearnsets() / loadMoveDefs(), so paging back and forth reuses them.
     */
    function renderMoves(p) {
      const container = el('move-section');
      const note = el('moves-note');

      const load = () => {
        if (container.dataset.loaded === 'true') return;
        container.dataset.loaded = 'true';
        Promise.all([loadLearnsets(), loadMoveDefs()])
          .then(([learnsets, moveDefs]) => {
            const learnset = learnsets[String(p.id)];
            renderMoveSection(container, learnset, moveDefs);
            note.textContent = learnset
              ? '全世代聯集，等級取最低；招式機編號依世代而異'
              : '暫無招式數據';
          })
          .catch(err => {
            console.error('Failed to load move learnsets:', err);
            note.textContent = '招式數據載入失敗';
            container.innerHTML = '<p class="detail-error">無法載入招式數據</p>';
          });
      };

      // Fall straight through where IntersectionObserver is unavailable.
      if (!('IntersectionObserver' in window)) {
        load();
        return;
      }
      const observer = new IntersectionObserver(entries => {
        if (!entries.some(entry => entry.isIntersecting)) return;
        observer.disconnect();
        load();
      }, { rootMargin: '400px' });
      observer.observe(el('moves-section'));
    }

    function renderDescriptions(p) {
      const desc = p.descriptions || {};
      const blocks = [
        { label: '繁體中文描述（主要）', text: desc.zh },
        { label: '繁體中文描述（補充）', text: desc.zh_text2 },
        { label: 'English (detailed)', text: desc.en_long },
        { label: 'Flavor text', text: desc.en_flavor },
        { label: 'English (short)', text: desc.en_short }
      ].filter(b => b.text);

      el('description-content').innerHTML = blocks.length
        ? blocks.map(b => `
            <div class="desc-block">
              <span class="desc-label">${b.label}</span>
              <p class="desc-text">${escapeHtml(b.text)}</p>
            </div>`).join('')
        : '<p class="eff-neutral">暫無描述資料</p>';
    }

    // The canvas is sized from its rendered box, so redraw when that box changes.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!currentPokemon) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => drawRadarChart(currentPokemon.stats), 150);
    });

    init();
  </script>
</body>
</html>
