<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 模型播放器</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png">
  <meta name="theme-color" content="#0b1020">
  <!-- Pre-paint theme resolver. Generated from scripts/lib/theme-init.mjs by
       scripts/sync_theme_init.mjs; the rationale is AGENTS.md §3.C. -->
  <script>
    (function () {
      var THEME_KEY = 'pokemon-theme';
      var theme = null;
      try {
        theme = localStorage.getItem(THEME_KEY);
      } catch (e) { /* private mode / storage disabled: resolve from the OS instead */ }
      if (theme !== 'light' && theme !== 'dark') {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
        theme = mq && mq.matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0b1020');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/model3d.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <!-- This is the ONLY page on the site that loads a third-party origin, so there
       is no house convention to copy — and it loads a lot from it. The importmap
       is resolved by the browser at module-graph time, so the four addons below
       are four separate files, not one bundle: five requests to unpkg, the first
       of which pays DNS + TCP + TLS while the visitor is already looking at an
       empty stage.

       gstatic is a SECOND origin, not a second file: DRACO_DECODER_PATH in
       model3d-viewer.js is `www.gstatic.com`, and it is a real round trip of its
       own. It is the one that is not visible, because it fires when the Draco
       worker starts, i.e. after the 541 KB GLB has already landed — so its cost
       is attributed to the model and never to the network. Both GLBs declare
       KHR_draco_mesh_compression in extensionsRequired, so this is not optional
       and check_glb.mjs fails if that ever stops being true.

       `preconnect` and not `modulepreload`, deliberately: a modulepreload would
       have to restate the unpkg URL, and the module header's whole claim is that
       repointing the importmap at vendored copies is a change to this block
       alone. An origin-level hint survives that edit; a hardcoded URL beside it
       would not. `crossorigin` is required, not decorative — without it the
       connection is opened in a mode the subsequent CORS fetches cannot reuse.
       Both origins answer with Access-Control-Allow-Origin: *, which the
       importmap strictly requires and which the Draco decoder requires for the
       same reason: it is instantiated with WebAssembly.instantiateStreaming. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body>
  <header class="header header-3d">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <a class="header-brand" href="index.html" aria-label="回到寶可夢演算法首頁"><span class="site-logo"><img src="assets/images/logo.png" alt="" width="180" height="180" decoding="async"></span>
      <!-- A div, not an <h1>: the header title is the site brand (寶可夢演算法)
           on every page, so the page's own <h1> lives inside <main> below.
           Two h1s on one page remains the one combination that appears nowhere
           in the site. -->
      <div class="header-title header-title-large">寶可夢演算法</div>
    </a>
    <nav class="site-nav" data-nav aria-label="主選單"></nav>
    <button class="site-nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="開啟選單"></button>
    <div class="site-nav-drawer" data-nav data-nav-drawer hidden></div>
  </header>

  <main class="m3d-layout">
    <div>
      <h1 class="page-h1">3D 模型播放器</h1>
      <div class="m3d-stage" id="stage">
        <!-- Static markup, so the two glyphs stay OUT of ICON_PATHS: that map
             exists for icons shared.js paints at runtime, and per the nav's own
             convention (shuffle / palette / back / forward) a single-page icon
             is written here once rather than duplicated into a shared table. The
             paths are Material's add and remove, i.e. literally ＋ and － as
             vectors — currentColor, so no font to disagree across platforms. -->
        <div class="m3d-zoom" id="zoom" role="group" aria-label="縮放" hidden>
          <button type="button" class="m3d-zoom-btn" id="zoom-in" aria-label="拉近">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button type="button" class="m3d-zoom-btn" id="zoom-out" aria-label="拉遠">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13H5v-2h14v2z"/></svg>
          </button>
        </div>
        <div class="m3d-status" id="status" role="status">
          <p class="m3d-status-title" id="status-title">載入中…</p>
          <p class="m3d-status-detail" id="status-detail"></p>
        </div>
      </div>
      <p class="m3d-note" id="model-note" style="margin-top:12px;"></p>
    </div>

    <div class="m3d-side">
      <div class="m3d-card">
        <h2 id="picker-label">選擇寶可夢</h2>
        <label class="m3d-sr-only" for="picker" hidden>選擇寶可夢</label>
        <select class="m3d-picker" id="picker" aria-labelledby="picker-label"></select>
        <div class="m3d-identity" id="identity" hidden>
          <img id="identity-sprite" alt="" width="56" height="56" decoding="async">
          <p><span id="identity-name"></span><span id="identity-sub"></span></p>
        </div>
      </div>

      <!-- The whole block is `hidden` for a model with 0 clips, and re-shown per
           load. Never disabled: a disabled row reads as broken. -->
      <div class="m3d-card m3d-playback" id="playback" hidden>
        <h2>播放控制</h2>
        <div class="m3d-progress-row">
          <div class="m3d-progress" id="progress" role="progressbar"
               aria-label="動畫播放進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="m3d-progress-fill" id="progress-fill"></div>
          </div>
          <span class="m3d-time" id="time">0.00s / 0.00s</span>
        </div>
        <div class="m3d-btn-row">
          <button type="button" class="btn" id="playpause" aria-label="播放"></button>
          <button type="button" class="btn" id="autorotate" aria-pressed="false"></button>
          <button type="button" class="btn" id="resetview" aria-label="重設視角"></button>
        </div>
        <div class="m3d-slider-row">
          <label for="speed">速度</label>
          <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
          <output for="speed" id="speed-out">1.0×</output>
        </div>
      </div>

      <div class="m3d-card" id="clip-card" hidden>
        <h2 id="clip-label">動畫</h2>
        <div class="m3d-clips" id="clips" role="group" aria-labelledby="clip-label"></div>
        <div class="m3d-btn-row" style="margin-top:12px">
          <!-- Text is the initial (unpainted) state; paintPlaybackButtons()
               rewrites it per state. Kept as 循環播放 so the button is readable
               before the first model loads. -->
          <button type="button" class="btn" id="loop" aria-pressed="false">循環播放</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    // hasGlb() comes from glb-index.js, NOT from shared.js — a missing export is
    // a SyntaxError at parse time that kills the whole module, and the only
    // symptom is a page stuck on 載入中… with no console error of its own.
    import {
      loadPokemonData, formatPokemonId, initThemeToggle, initHeaderNav,
      iconSvg, ASSETS
    } from './assets/js/shared.js';
    import { GLB_IDS } from './assets/js/glb-index.js';
    import { createViewer, clipLabel } from './assets/js/model3d-viewer.js';

    initThemeToggle();
    initHeaderNav();

    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const statusTitle = document.getElementById('status-title');
    const statusDetail = document.getElementById('status-detail');
    const modelNote = document.getElementById('model-note');
    const picker = document.getElementById('picker');
    const identity = document.getElementById('identity');
    const identitySprite = document.getElementById('identity-sprite');
    const identityName = document.getElementById('identity-name');
    const identitySub = document.getElementById('identity-sub');
    const playback = document.getElementById('playback');
    const clipCard = document.getElementById('clip-card');
    const clipsBox = document.getElementById('clips');
    const playBtn = document.getElementById('playpause');
    const autoBtn = document.getElementById('autorotate');
    const resetBtn = document.getElementById('resetview');
    const loopBtn = document.getElementById('loop');
    const zoomBox = document.getElementById('zoom');
    const zoomIn = document.getElementById('zoom-in');
    const zoomOut = document.getElementById('zoom-out');
    const speed = document.getElementById('speed');
    const speedOut = document.getElementById('speed-out');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progress-fill');
    const timeLabel = document.getElementById('time');

    // The label table lives in model3d-viewer.js and is reached through
    // clipLabel(). An earlier draft kept a second copy here so the page could
    // label a button; that is the duplication the module-header note is
    // about, and it was already wrong within one commit — the
    // copy did not know about the `001a` exporter prefix, so all nine of 1.glb's
    // buttons would have silently fallen back to their raw names.
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Declared above the overlay/zoom helpers that read them, not below. A
    // function body only runs at CALL time, so a `let` further down the module
    // would work by accident — until a path reached syncZoomButtons() first, at
    // which point `if (!viewer)` hits the temporal dead zone and throws a
    // ReferenceError instead of returning false. Four hundred lines of "works
    // today" is not a reason to leave the trap in place.
    let viewer = null;
    let data = [];
    let current = null;

    function setStatus(title, detail) {
      // A status on screen means there is nothing to zoom. Tying the zoom pair's
      // visibility to this one function rather than to `viewer.load`'s success
      // branch is the point: every path that ends with an empty stage (loading,
      // no GLB, parse failure, no WebGL, context lost) goes through here, and a
      // second flag set at each of those five sites is five chances to forget one.
      zoomBox.hidden = !!title;
      if (!title) { status.hidden = true; return; }
      status.hidden = false;
      statusTitle.textContent = title;
      statusDetail.textContent = detail || '';
    }

    /**
     * Steps are ratios, and the numbers are on this side of the wire rather than
     * in the viewer: they are a UI tempo choice (how brisk one press feels), not
     * a property of the model. zoomBy() takes the ratio as an argument precisely
     * so that this line, and not a constant in the render loop, is what someone
     * edits to make the buttons gentler or snappier.
     */
    const ZOOM_IN = 0.8;
    const ZOOM_OUT = 1.25;

    /**
     * Mirror the viewer's zoom limits onto the two buttons as aria-disabled.
     *
     * Called from onFrame rather than only from the click handlers, because the
     * WHEEL also moves the camera: syncing on clicks alone would leave the pair
     * reading 可用 while the wheel had already driven the camera to the stop, and
     * pressing ＋ then would do nothing with no explanation. The frame callback
     * fires ~60 times a second, so the cached signature is the whole cost
     * control — two reads, and an attribute write only on the transitions (twice
     * per wheel gesture, not once per frame).
     */
    let zoomSignature = '';
    function syncZoomButtons() {
      if (!viewer) return;
      const { canZoomIn, canZoomOut } = viewer.zoomLimits();
      const signature = `${canZoomIn}|${canZoomOut}`;
      if (signature === zoomSignature) return;
      zoomSignature = signature;
      zoomIn.setAttribute('aria-disabled', String(!canZoomIn));
      zoomOut.setAttribute('aria-disabled', String(!canZoomOut));
    }

    function applyZoom(ratio) {
      // zoomBy returns whether the camera moved; at a limit it returns false, and
      // there is nothing to repaint, so the click is simply absorbed.
      viewer.zoomBy(ratio);
      syncZoomButtons();
    }

    /**
     * WebGL support probe, before any three.js code runs.
     *
     * `new WebGLRenderer()` on a machine without WebGL throws a bare
     * "Error creating WebGL context", which says nothing about the cause; asking
     * for a context on a throwaway canvas and catching the failure lets the page
     * say so in the visitor's language instead. The context is explicitly lost
     * again — Safari counts live contexts and starts dropping the oldest.
     */
    function webglSupported() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl2') || c.getContext('webgl');
        if (!gl) return false;
        const lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
        return true;
      } catch (e) {
        return false;
      }
    }

    // The play/pause glyph is swapped by JS, so the path lives in shared.js's
    // ICON_PATHS rather than being written into this markup too. See the comment
    // on those four entries.
    //
    // The two toggles are labelled by STATE, not just tinted by it. `循環播放` on a
    // button that is not looping is not a label, it is a command — the same
    // ambiguity avoided by making planned cards non-focusable. So the
    // text names the current mode (循環播放 while looping, 單次播放 while not) and
    // the gold pressed style in shared.css carries the redundant channel for
    // anyone who cannot separate the two colours.
    function paintPlaybackButtons(state) {
      const playing = state.playing;
      playBtn.innerHTML = iconSvg(playing ? 'pause' : 'play') +
        `<span>${playing ? '暫停' : '播放'}</span>`;
      playBtn.setAttribute('aria-label', playing ? '暫停動畫' : '播放動畫');

      const rotating = !!state.autoRotating;
      autoBtn.innerHTML = iconSvg('orbit') +
        `<span>${rotating ? '旋轉中' : '自動旋轉'}</span>`;
      autoBtn.setAttribute('aria-pressed', String(rotating));

      resetBtn.innerHTML = iconSvg('reset') + '<span>重設視角</span>';

      const looping = !!state.loop;
      loopBtn.innerHTML = iconSvg('orbit') +
        `<span>${looping ? '循環播放' : '單次播放'}</span>`;
      loopBtn.setAttribute('aria-pressed', String(looping));
      // Single-clip models hide this button entirely, so its label has to be
      // re-derived on load rather than only on click: a one-shot arrives with
      // state.loop already false and would otherwise keep the markup's default
      // text until the first press.
    }

    function renderClips(clips) {
      clipsBox.innerHTML = clips.map((clip, i) => {
        const { label } = clipLabel(clip.name);
        // Always show the raw name. For an unrecognised token the label IS the
        // raw name, so printing both would duplicate it.
        const tail = label ? `<code>${esc(clip.name)}</code>` : '';
        return `<button type="button" class="m3d-clip" data-clip="${i}" aria-pressed="${i === 0}">` +
          `<span>${label ? esc(label) : esc(clip.name)}</span>${tail}</button>`;
      }).join('');
    }

    function paintProgress(fraction, state) {
      const action = state.actions[state.activeIndex];
      const clip = action ? action.getClip() : null;
      const total = clip ? clip.duration : 0;
      const pct = Math.round(fraction * 100);
      progressFill.style.width = `${pct}%`;
      progress.setAttribute('aria-valuenow', String(pct));
      timeLabel.textContent = total
        ? `${(fraction * total).toFixed(2)}s / ${total.toFixed(2)}s`
        : '0.00s / 0.00s';
    }

    async function show(id) {
      current = id;
      // `picker.value = String(id)` below is unguarded ON PURPOSE, and the obvious
      // "fix" is a real regression. A model-less id — `?id=999`, or a deep link
      // from a detail page for a Pokémon we ship no GLB for — has no option in
      // this list, and the stage overlay is what explains that (這隻寶可夢還沒有
      // 3D 模型).
      //
      // MEASURED, because the obvious reading of the spec is wrong here. The HTML
      // spec does say a single-select with nothing selected takes its "default
      // state" at index 0, which reads as though a non-matching assignment would
      // silently fall back to 妙蛙種子 and the visitor would never notice. It
      // does not. Driving Chrome over CDP with the option list populated:
      //
      //     guarded, on cold load        selectedIndex  0   value "1"   #0001 妙蛙種子
      //     picker.value = '999'         selectedIndex -1   value ""    (nothing shown)
      //     picker.value = '1'           selectedIndex  0   value "1"   #0001 妙蛙種子
      //
      // so a rejected value paints a BLANK control, not a fallback. The index-0
      // rule is about `:default` and about which option is selected before any
      // assignment — not about what a rejected value renders.
      //
      // Blank is the honest state and is left as one. Guarding the assignment
      // looks tidier and is worse: it leaves the last real option showing, so a
      // cold deep link to `?id=999` puts #0001 妙蛙種子 in the select under a
      // document titled "#0999 索財靈 3D 模型" — the select asserting an identity
      // the title and the identity row have already contradicted. Blank admits
      // it cannot show this one. A placeholder option is the only third answer
      // and is a design decision, not a cleanup; re-decide it deliberately or
      // leave this line alone.
      picker.value = String(id);
      const p = data.find(d => d.id === id);
      if (p) {
        identity.hidden = false;
        identitySprite.src = `${ASSETS.images}${p.filename}`;
        identityName.textContent = p.names.zh;
        identitySub.textContent = `#${formatPokemonId(p.id)} ${p.names.en}・${p.types_zh.join(' / ')}`;
        document.title = `#${formatPokemonId(p.id)} ${p.names.zh} 3D 模型`;
      }

      setStatus('載入模型中…', '正在解析 Draco 網格');
      const result = await viewer.load(id);

      if (!result.ok) {
        // A superseded load is not a state to render. Whoever is waiting on it
        // has already been replaced by a newer show() call, and writing the
        // empty state here would blank the panel under the model that IS on
        // screen.
        if (result.reason === 'superseded') return;
        playback.hidden = true;
        clipCard.hidden = true;
        clipsBox.innerHTML = '';
        if (result.reason === 'missing') {
          setStatus('這隻寶可夢還沒有 3D 模型',
            GLB_IDS.size === 1 ? '目前只有 1 隻有模型' : `目前共 ${GLB_IDS.size} 隻有模型`);
        } else {
          setStatus('3D 模型載入失敗',
            '檔案可能下載不完整，或 Draco 解碼器無法連線');
          console.error(result.error);
        }
        return;
      }

      const clips = result.clips;
      // 0 clips: no playback row at all. 1 clip: a single button, one-shot.
      // N clips: every one listed, looping by default.
      playback.hidden = clips.length === 0;
      clipCard.hidden = clips.length === 0;
      if (clips.length) {
        renderClips(clips);
        const single = clips.length === 1;
        loopBtn.hidden = single;
        // `aria-pressed` AND the label both come from the viewer, via
        // paintPlaybackButtons. Setting the attribute here in isolation is what
        // left the button stale before: a one-shot loads with state.loop already
        // false, so the label has to be re-derived here, not only on the next
        // click. Reading it back from the viewer rather than recomputing
        // `clips.length > 1` keeps this from becoming a second implementation
        // of the same rule.
        paintPlaybackButtons(viewer.state);
        setStatus(null);
      } else {
        clipsBox.innerHTML = '';
        setStatus(null);
      }

      const clipNames = clips.map(c => c.name).join('、');
      modelNote.innerHTML = clips.length
        ? `${GLB_IDS.size} 隻寶可夢有 3D 模型。這隻有 <strong>${clips.length}</strong> 個動畫：${esc(clipNames)}。` +
          `拖曳可旋轉、滾輪可縮放。`
        : `${GLB_IDS.size} 隻寶可夢有 3D 模型，這隻沒有內建動畫。拖曳可旋轉、滾輪可縮放。`;
    }

    // ---------- boot ----------

    if (!webglSupported()) {
      setStatus('此瀏覽器不支援 WebGL', '3D 模型需要 WebGL，請更新瀏覽器或開啟硬體加速');
      picker.disabled = true;
    } else {
      viewer = createViewer({
        mount: stage,
        onContextLost: (detail) => setStatus('3D 畫面暫時中斷', detail),
        onContextRestored: () => {
          // Only clear the overlay if there is a model to show. After a
          // context loss on a page that failed to load anything, "restored"
          // is true and the stage is still empty, so hiding the status would
          // leave a bare canvas with no explanation on it.
          if (viewer && current && GLB_IDS.has(current)) setStatus(null);
        },
        onFrame: (fraction, state) => {
          paintProgress(fraction, state);
          // Ahead of the playback early-return below: the WHEEL moves the camera
          // whether or not a model is animating, and with playback hidden the
          // zoom buttons would stop tracking it. A model with 0 clips still
          // zooms, so this cannot live under `if (playback.hidden)`.
          syncZoomButtons();
          // The play/pause label is repainted here rather than on click: a
          // one-shot clip ends on its own and the button has to follow.
          if (playback.hidden) return;
          const want = state.playing ? '暫停' : '播放';
          if (playBtn.textContent.trim().slice(-2) !== want) paintPlaybackButtons(state);
        }
      });

      document.addEventListener('themechange', () => viewer.onThemeChange());

      const requested = new URLSearchParams(location.search).get('id');
      // ?id= is honoured even when the id has no model, because a deep link
      // from a detail page must land on a page that explains itself rather than
      // silently redirecting to some other Pokémon.
      data = await loadPokemonData().catch(() => []);

      const ids = [...GLB_IDS].sort((a, b) => a - b);
      picker.innerHTML = ids.map(id => {
        const p = data.find(d => d.id === id);
        const name = p ? p.names.zh : `#${formatPokemonId(id)}`;
        return `<option value="${id}">#${formatPokemonId(id)} ${esc(name)}</option>`;
      }).join('');

      picker.addEventListener('change', () => {
        show(Number(picker.value));
        const url = new URL(location.href);
        url.searchParams.set('id', picker.value);
        history.replaceState(null, '', url);
      });

      playBtn.addEventListener('click', () => {
        viewer.setPlaying(!viewer.state.playing);
        paintPlaybackButtons(viewer.state);
      });
      autoBtn.addEventListener('click', () => {
        const on = autoBtn.getAttribute('aria-pressed') !== 'true';
        // One writer for the mode, on both sides of it. This handler used to
        // call setAutoRotate AND then assign viewer.state.autoRotating itself,
        // because the key was missing from the viewer's state literal; it is
        // declared there now, so the second write is not just redundant, it was
        // the thing that let the button and the scene drift apart. See
        // setAutoRotate() in assets/js/model3d-viewer.js.
        viewer.setAutoRotate(on);
        paintPlaybackButtons(viewer.state);
      });
      resetBtn.addEventListener('click', () => {
        viewer.resetView();
        syncZoomButtons();
      });

      // ── Zoom ─────────────────────────────────────────────────────────────
      // The buttons exist because zoom was wheel/pinch ONLY, and OrbitControls
      // ships no keyboard zoom — so a keyboard user and anyone who cannot use a
      // scroll wheel had no way in at all. That is the accessibility case; the
      // discoverability case is the ordinary one.
      zoomIn.addEventListener('click', () => applyZoom(ZOOM_IN));
      zoomOut.addEventListener('click', () => applyZoom(ZOOM_OUT));

      // Keyboard mirror of the two buttons, as asked for. Three things it is NOT:
      // it does not listen on the buttons (Enter/Space already activate a real
      // <button>, so binding there would double every press); it does not fire on
      // repeat (holding a key is handled by the keydown auto-repeat, and an extra
      // tick would double-step); and it does not fire when a modifier is held,
      // because Ctrl+plus / Cmd+minus / Cmd+0 are the browser's own zoom and
      // swallowing them would break the one zoom control the visitor always has.
      //
      // The editable-target guard is the standard one, and it is here because
      // this page has a <select> and a <input type=range>: a bare keydown handler
      // would eat a "=" typed into a field. isComposing covers CJK IME, where
      // "+" is a candidate being assembled and must not zoom the model.
      const ZOOM_KEYS = {
        '+': ZOOM_IN, '=': ZOOM_IN, 'Add': ZOOM_IN, 'NumpadAdd': ZOOM_IN,
        '-': ZOOM_OUT, '_': ZOOM_OUT, 'Subtract': ZOOM_OUT, 'NumpadSubtract': ZOOM_OUT
      };
      addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing || e.repeat) return;
        const ratio = ZOOM_KEYS[e.key];
        if (ratio === undefined) return;
        const t = e.target;
        if (t && (t.isContentEditable ||
          /^(input|textarea|select)$/i.test(t.tagName))) return;
        // The page must have something to zoom. Cheap test, and the alternative
        // — letting a press fall through to viewer.zoomBy() with no model — is a
        // silent no-op on a stage that says 載入中.
        if (zoomBox.hidden || !viewer || !current) return;
        e.preventDefault();
        applyZoom(ratio);
      });
      loopBtn.addEventListener('click', () => {
        const on = loopBtn.getAttribute('aria-pressed') !== 'true';
        viewer.setLoop(on);
        paintPlaybackButtons(viewer.state);
      });
      speed.addEventListener('input', () => {
        viewer.setTimeScale(speed.value);
        speedOut.textContent = `${Number(speed.value).toFixed(1)}×`;
      });
      clipsBox.addEventListener('click', e => {
        const btn = e.target.closest('[data-clip]');
        if (!btn) return;
        viewer.selectClip(Number(btn.dataset.clip));
        clipsBox.querySelectorAll('[data-clip]').forEach(b =>
          b.setAttribute('aria-pressed', String(b === btn)));
        paintPlaybackButtons(viewer.state);
      });

      // BFCache is why this is pagehide and not unload: a page put in the
      // bfcache can be restored, and a page that only had `unload` would come
      // back with `disposed` still true, so its rAF loop is dead and the stage
      // is a frozen last frame. A bfcached page is never unloaded, and its
      // WebGL context is kept by the browser, so the safest disposition is to
      // let the `persisted` case do nothing at all.
      addEventListener('pagehide', e => {
        if (e.persisted || !viewer) return;
        viewer.dispose();
      });

      const initial = requested && /^\d+$/.test(requested) ? Number(requested) : ids[0];
      await show(initial);
    }
  </script>
</body>
</html>
