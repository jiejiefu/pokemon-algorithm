<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排序演算法視覺化 — 1025 寶可夢演算法實驗室</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0d1117">
  <!-- Blocking, inline, and before the stylesheet on purpose. It has to resolve a
       theme before the first paint so the page never flashes one palette and then
       repaints in the other; a module in shared.js cannot do this because module
       scripts are deferred by definition. It is also the only place a theme is
       resolved, and it ALWAYS writes a concrete value, which is why shared.css
       has no prefers-color-scheme media query: a `:root:not([data-theme="dark"])`
       block could never match once this runs. :root's dark palette is the no-JS
       fallback. Kept in sync with THEME_COLORS in assets/js/shared.js. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('pokemon-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* private mode / storage disabled: stay on the default */ }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f8fa' : '#0d1117');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .header-sort { padding: 12px 20px; }
    .canvas-container { flex: 1; width: 100%; }
  </style>
</head>
<body>
  <header class="header header-sort">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <div class="header-title">排序演算法視覺化</div>
    <div class="controls">
      <button class="btn btn-utility" data-action="shuffle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>隨機打亂</button>
      <span class="btn-group-label">| 排序演算法：</span>
      <button class="btn" data-action="sort" data-algorithm="bubble">氣泡</button>
      <button class="btn" data-action="sort" data-algorithm="selection">選擇</button>
      <button class="btn" data-action="sort" data-algorithm="insertion">插入</button>
      <button class="btn" data-action="sort" data-algorithm="quick">快速</button>
      <button class="btn" data-action="sort" data-algorithm="merge">合併</button>
      <button class="btn" data-action="sort" data-algorithm="heap">堆積</button>
      <span class="btn-group-label">| 色彩：</span>
      <button class="btn btn-color" data-action="color"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>色彩聚類</button>
    </div>
  </header>

  <div class="canvas-container">
    <div id="loading" class="loading-overlay">載入 1025 隻寶可夢資料與圖片中，請稍候...</div>
    <canvas id="appCanvas"></canvas>
  </div>

  <script type="module">
    // PokemonNode / shuffleArray / groupByColor come from shared.js below; the
    // six *Steps generators come from sorting-algorithms.js, which is a CLASSIC
    // script (see the tag at the end of body), so those really are globals.
    import {loadPokemonData,
      loadAllPokemonNodes,
      PokemonNode,
      GRID_CONFIG,
      updateGridPositions,
      groupByColor as sharedGroupByColor,
      shuffleArray, initThemeToggle } from './assets/js/shared.js';
    // Wire the theme toggle before anything else. Module scripts are deferred, so
    // the DOM is already parsed here and the button in the header is present.
    initThemeToggle();

    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');
    const loadingText = document.getElementById('loading');

    canvas.width = GRID_CONFIG.CANVAS_WIDTH;
    canvas.height = GRID_CONFIG.CANVAS_HEIGHT;

    let pokemons = [];
    let sortGenerator = null;

    async function init() {
      try {
        const jsonData = await loadPokemonData();
        pokemons = await loadAllPokemonNodes(jsonData, GRID_CONFIG.CANVAS_WIDTH, GRID_CONFIG.CANVAS_HEIGHT);
        updateGridPositions(pokemons);
        loadingText.style.display = 'none';
        requestAnimationFrame(renderLoop);
      } catch (error) {
        loadingText.innerText = '載入失敗！請確認是否使用 Local Server';
        console.error(error);
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (sortGenerator) {
        const res = sortGenerator.next();
        updateGridPositions(pokemons);
        if (res.done) sortGenerator = null;
      }

      for (let i = 0; i < pokemons.length; i++) {
        pokemons[i].update();
        pokemons[i].draw(ctx);
      }

      requestAnimationFrame(renderLoop);
    }

    function shufflePokemon() {
      sortGenerator = null;
      shuffleArray(pokemons);
      updateGridPositions(pokemons);
    }

    function runAlgorithm(type) {
      sortGenerator = null;
      switch(type) {
        case 'bubble': sortGenerator = bubbleSortSteps(pokemons); break;
        case 'selection': sortGenerator = selectionSortSteps(pokemons); break;
        case 'insertion': sortGenerator = insertionSortSteps(pokemons); break;
        case 'quick': sortGenerator = quickSortSteps(pokemons); break;
        case 'merge': sortGenerator = mergeSortSteps(pokemons); break;
        case 'heap': sortGenerator = heapSortSteps(pokemons); break;
      }
    }

    function groupByColor() {
      sortGenerator = null;
      sharedGroupByColor(pokemons);
    }

    // These used to be inline onclick="" attributes. That cannot work here: an
    // inline handler resolves its callee on the global object, and everything
    // in this file lives in module scope, so every button raised
    // "ReferenceError: runAlgorithm is not defined". The generators are the
    // exception — they come from a classic script below, so they *are* global.
    // Wiring the same way pokedex.html does, with addEventListener.
    document.querySelector('[data-action="shuffle"]')
      .addEventListener('click', shufflePokemon);
    for (const btn of document.querySelectorAll('[data-action="sort"]')) {
      btn.addEventListener('click', () => runAlgorithm(btn.dataset.algorithm));
    }
    document.querySelector('[data-action="color"]')
      .addEventListener('click', groupByColor);

    init();
  </script>

  <script src="assets/js/sorting-algorithms.js"></script>
</body>
</html>
