<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1025 全國寶可夢圖鑑</title>
  <link rel="stylesheet" href="assets/css/shared.css">
</head>
<body>
  <header class="header header-dex">
    <h1>1025 全國寶可夢圖鑑</h1>
    <div class="header-nav">
      <a href="sorting.html" class="sort-link">🎯 排序演算法</a>
      <a href="maze.html" class="maze-link">🎮 像素迷宮</a>
      <a href="pokedex.html" class="dex-link active">📖 完整圖鑑</a>
    </div>
  </header>

  <div class="search-controls">
    <input type="number" id="searchInput" class="search-input" placeholder="輸入編號 (e.g. 25)..." oninput="filterPokedex()">
    <select id="colorFilter" class="search-select" onchange="filterPokedex()">
      <option value="all">所有顏色 (All Colors)</option>
      <option value="Red">紅色 (Red)</option>
      <option value="Blue">藍色 (Blue)</option>
      <option value="Green">綠色 (Green)</option>
      <option value="Yellow">黃色 (Yellow)</option>
      <option value="Purple">紫色 (Purple)</option>
      <option value="Pink">粉色 (Pink)</option>
      <option value="Brown">棕色 (Brown)</option>
      <option value="Black">黑色 (Black)</option>
      <option value="White/Gray">灰白 (White/Gray)</option>
    </select>
  </div>

  <div id="loading" class="loading-text">讀取圖鑑資料中...</div>
  <div id="pokedex-grid" class="pokedex-grid"></div>

  <script type="module">
    import { loadPokemonData, renderPokemonGrid, BADGE_COLORS } from './assets/js/shared.js';

    const grid = document.getElementById('pokedex-grid');
    const loading = document.getElementById('loading');
    let allPokemonData = [];

    async function fetchPokedex() {
      try {
        allPokemonData = await loadPokemonData();
        loading.style.display = 'none';
        renderGrid(allPokemonData);
      } catch (error) {
        loading.innerText = '載入失敗，請確認是否使用 Local Server 開啟。';
        console.error(error);
      }
    }

    function renderGrid(dataArray) {
      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();
      
      dataArray.forEach(pokemon => {
        const formattedId = String(pokemon.id).padStart(4, '0');
        const group = pokemon.color_group || "White/Gray";
        const badgeColor = BADGE_COLORS[group] || "#9e9e9e";

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="assets/images/pokemon/${pokemon.filename}" alt="Pokemon ${formattedId}" loading="lazy">
          <div class="card-id">#${formattedId}</div>
          <div class="card-title">Pokemon ${pokemon.id}</div>
          <span class="color-badge" style="background-color: ${badgeColor};">${group}</span>
        `;
        fragment.appendChild(card);
      });
      grid.appendChild(fragment);
    }

    function filterPokedex() {
      const searchText = document.getElementById('searchInput').value;
      const selectedColor = document.getElementById('colorFilter').value;

      const filteredData = allPokemonData.filter(pokemon => {
        const matchId = searchText === '' || String(pokemon.id).includes(searchText);
        const matchColor = selectedColor === 'all' || pokemon.color_group === selectedColor;
        return matchId && matchColor;
      });

      renderGrid(filteredData);
    }

    window.onload = fetchPokedex;
  </script>
</body>
</html>
