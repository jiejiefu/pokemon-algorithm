<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢特性大全 — 314 種特性完整資料庫</title>
  <meta name="description" content="寶可夢 314 種特性的完整資料庫：效果說明、引入世代、常見特性與隱藏特性，以及擁有每一種特性的寶可夢名單。可搜尋中文名、英文名與編號。">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png">
  <meta name="theme-color" content="#0b1020">
  <!-- Blocking, inline, and before the stylesheet, same block and same reason as
       every other page: the sticky controls must not flash the wrong palette. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('pokemon-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* private mode / storage disabled: stay on the default */ }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0b1020');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/abilities.css">
</head>
<body>
  <header class="header header-dex">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="切換淺色主題" title="切換淺色主題"></button>
    <a class="header-brand" href="index.html">
      <span class="site-logo" aria-hidden="true"></span>
      <div class="header-title header-title-large">寶可夢演算法</div>
    </a>
    <nav class="site-nav" data-nav aria-label="主選單"></nav>
    <button class="site-nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="開啟選單"></button>
    <div class="site-nav-drawer" data-nav data-nav-drawer hidden></div>
  </header>

  <main class="ab-page">
    <nav class="breadcrumb" aria-label="麵包屑">
      <a href="index.html">首頁</a> / <a href="pokedex.html">圖鑑</a> / <span aria-current="page">特性</span>
    </nav>

    <section class="ab-hero" aria-labelledby="ab-title">
      <h1 id="ab-title">寶可夢特性大全</h1>
      <p class="ab-hero-sub">
        特性從第三世代開始出現，每隻寶可夢都有，多數有兩種常見特性與一種隱藏特性。
        這裡收錄 314 種特性的效果說明與持有者名單。點任何一張卡片可以看完整說明，
        以及哪些寶可夢把它當作常見特性、哪些把它當作隱藏特性。
      </p>
      <ul class="ab-stats" id="ab-stats"></ul>
    </section>

    <div class="ab-controls">
      <label class="sr-only" for="ab-search">搜尋特性</label>
      <input
        class="ab-search"
        id="ab-search"
        type="search"
        placeholder="搜尋中文名、英文名或編號，例如 威嚇、intimidate 或 022"
        autocomplete="off"
        spellcheck="false">
      <div class="ab-chiprow" id="ab-filters"></div>
    </div>

    <section class="ab-species" id="ab-species" aria-labelledby="ab-species-h" hidden>
      <h2 class="ab-species-h" id="ab-species-h">這隻寶可夢的特性</h2>
      <div id="ab-species-list"></div>
      <p class="ab-species-more" id="ab-species-more" hidden></p>
    </section>

    <p class="ab-resultline" id="ab-resultline" role="status" aria-live="polite"></p>

    <div id="ab-grid-wrap">
      <p class="ab-status" id="ab-status">載入中…</p>
    </div>
  </main>

  <p class="footer-note">特性資料來自 PokeAPI・共 314 種特性・寶可夢資料共 1,025 隻</p>

  <script type="module">
    import { initThemeToggle, initHeaderNav } from './assets/js/shared.js';
    import {
      prepareAbilities, filterAbilities, loadAbilities,
      buildSpeciesIndex, filterSpecies, speciesSlots, speciesIdText,
      loadSpeciesAbilities, SPECIES_RESULT_CAP,
      abilityName, abilityIsFallbackName, abilityEffect, abilityEffectEn,
      abilityGenerationText, abilityUrl, holderUrl, holderSprite
    } from './assets/js/abilities.js';

    initThemeToggle();
    initHeaderNav('abilities.html');

    /**
     * The filter state lives in the URL, exactly as it does on moves.html, and
     * for the same reason: every combination is a link a reader can copy to a
     * friend, a reload survives it, and `abilities.html?gen=3` is a real
     * destination. The deep link IS the thing the filters build, not a second
     * implementation of it.
     */
    const params = new URLSearchParams(location.search);

    const state = {
      q: params.get('q') || '',
      gen: params.get('gen') ? Number(params.get('gen')) : null,
      hidden: params.get('hidden') === '1',
      form: params.get('form') === '1'
    };

    const els = {
      search: document.getElementById('ab-search'),
      filters: document.getElementById('ab-filters'),
      stats: document.getElementById('ab-stats'),
      resultLine: document.getElementById('ab-resultline'),
      wrap: document.getElementById('ab-grid-wrap'),
      status: document.getElementById('ab-status'),
      species: document.getElementById('ab-species'),
      speciesList: document.getElementById('ab-species-list'),
      speciesMore: document.getElementById('ab-species-more')
    };

    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    let rows = [];
    let speciesIndex = [];

    function setParam(key, value) {
      if (value === null || value === '' || value === undefined || value === false) {
        params.delete(key);
      } else {
        params.set(key, key === 'gen' ? String(value) : '1');
      }
      const query = params.toString();
      history.replaceState(null, '', query ? `?${query}` : location.pathname);
    }

    /* ---- filters ---- */

    /**
     * One filter row. The accepted values are read from the loaded rows rather
     * than restated, for moves.html's reason: a chip list typed out next to the
     * filter it filters is a second answer to the same question, and it goes
     * stale silently because the stale list still parses and still renders.
     */
    function chipRow(label, key, values, labelFor) {
      const group = document.createElement('div');
      group.className = 'ab-chipgroup';
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', label);

      const caption = document.createElement('span');
      caption.className = 'ab-chipgroup-label';
      caption.textContent = label;
      group.appendChild(caption);

      const pressed = () => (key === 'gen' ? String(state.gen) : state[key] ? '1' : '0');

      for (const value of values) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'ab-chip';
        chip.dataset.filter = key;
        chip.dataset.value = value == null ? '' : String(value);
        chip.textContent = labelFor(value);
        chip.setAttribute('aria-pressed', String(pressed() === chip.dataset.value));
        chip.addEventListener('click', () => {
          const next = pressed() === chip.dataset.value ? null : chip.dataset.value;
          // `gen` is a number and the other two are flags, and getting this
          // wrong is silent: Number('1') on the flag rows would give a filter
          // that matches nothing while the chip still looks pressed. moves.html
          // documents the same trap on its learnability chip.
          if (key === 'gen') {
            state.gen = next === null ? null : Number(next);
          } else {
            state[key] = next !== null;
          }
          setParam(key, state[key]);
          render();
        });
        group.appendChild(chip);
      }
      return group;
    }

    function renderFilters() {
      const generations = [...new Set(rows.map(a => a.generation))].sort((a, b) => a - b);
      const frag = document.createDocumentFragment();
      frag.appendChild(chipRow(
        '世代', 'gen', generations,
        gen => `${abilityGenerationText(gen)} · ${rows.filter(a => a.generation === gen).length}`
      ));
      frag.appendChild(chipRow('特性種類', 'hidden', [1], () =>
        `有隱藏特性 · ${rows.filter(a => a.hasHidden).length}`
      ));
      frag.appendChild(chipRow('特性種類', 'form', [1], () =>
        `含形態專屬 · ${rows.filter(a => a.formCount).length}`
      ));
      els.filters.replaceChildren(frag);
    }

    /* ---- stats ---- */

    function renderStats() {
      const items = [
        { value: rows.length, label: '特性' },
        { value: rows.filter(a => a.nameZh).length, label: '已中文化' },
        { value: new Set(rows.map(a => a.generation)).size, label: '世代' },
        { value: rows.filter(a => a.hasHidden).length, label: '含隱藏特性' }
      ];
      els.stats.replaceChildren(...items.map(item => {
        const li = document.createElement('li');
        li.className = 'ab-stat';
        const value = document.createElement('span');
        value.className = 'ab-stat-value';
        value.textContent = item.value.toLocaleString('en-US');
        const label = document.createElement('span');
        label.className = 'ab-stat-label';
        label.textContent = item.label;
        li.append(value, label);
        return li;
      }));
    }

    /* ---- the grid ---- */

    /**
     * One card. The Chinese effect is the point of the card, so the English
     * fallback is not spliced into it — it gets its own labelled block below.
     * A card that mixed the two languages inside one sentence would be a bug
     * (AGENTS.md §3.W), and one that printed neither would be a blank rectangle
     * on a page whose entire subject is the description.
     */
    function cardHtml(ability) {
      const zh = abilityEffect(ability);
      const en = zh ? '' : abilityEffectEn(ability);
      return `<a class="ab-card" href="${esc(abilityUrl(ability))}">
        <span class="ab-card-head">
          <span class="ab-card-name${abilityIsFallbackName(ability) ? ' is-en' : ''}">${esc(abilityName(ability))}</span>
          <span class="ab-card-en">${esc(ability.nameEn)}</span>
          <span class="ab-gen">${esc(abilityGenerationText(ability.generation))}</span>
        </span>
        ${zh ? `<p class="ab-card-effect">${esc(zh)}</p>` : ''}
        ${en ? `<p class="ab-en-note"><span class="ab-en-note-label">英文原文（PokeAPI）</span>${esc(en)}</p>` : ''}
        <span class="ab-card-meta">
          <span>${ability.speciesCount} 隻寶可夢</span>
          ${ability.formCount ? `<span>其中 ${ability.formCount} 個形態</span>` : ''}
          ${ability.hasHidden ? '<span class="ab-badge ab-badge-hidden">有隱藏特性</span>' : ''}
        </span>
      </a>`;
    }

    /* ---- the reverse lookup: species -> its abilities ---- */

    /**
     * One ability chip inside a species row. `bySlug` is the page's own
     * abilities.json, so the name printed is the same name the card below would
     * print for the same ability — two namers for one ability is the defect
     * §3.B2 found on color.html, and there is no reason to reintroduce it here.
     *
     * A slug the index names but abilities.json does not have is rendered as the
     * slug in italic rather than dropped: the panel's job is to answer the
     * question, and silently omitting one of three abilities would make the
     * answer confidently wrong. check_abilities_data.mjs asserts the two sets
     * are identical, so this branch is a degradation, not a normal path.
     */
    function slotChipHtml(slug, bySlug) {
      const ability = bySlug[slug];
      const label = ability ? abilityName(ability) : slug;
      const cls = ability && abilityIsFallbackName(ability) ? 'ab-chip is-en' : 'ab-chip';
      return `<li><a class="${cls}" href="${esc(abilityUrl(slug))}">${esc(label)}</a></li>`;
    }

    function speciesRowHtml(species, bySlug) {
      const { reg, hid, shared, single } = speciesSlots(species);
      // holderUrl/holderSprite read `nameEn` off the row, which is exactly the
      // field this index carries — so the species link is built through the same
      // canonical helper ability.html uses, keeping nidoran-f / nidoran-m
      // distinct (§3.A).
      const href = holderUrl({ nameEn: species.nameEn });
      // Three groups, never two: the 12 species whose regional forme folds onto
      // the base one end up with a slug that is one forme's regular ability and
      // another's hidden one, and printing it under either heading alone would
      // be a confident wrong answer. speciesSlots() has already removed those
      // from both lists, so nothing can render twice.
      const slot = (label, slugs) => (slugs.length
        ? `<div class="ab-slot">
            <span class="ab-slot-label">${label}</span>
            <ul class="ab-slot-chips">${slugs.map(s => slotChipHtml(s, bySlug)).join('')}</ul>
          </div>`
        : '');
      return `<li class="ab-species-row">
        <a class="ab-species-id" href="${esc(href)}">
          <img class="ab-species-sprite" src="${esc(holderSprite({ baseId: species.id }))}"
               alt="" loading="lazy" width="56" height="56">
          <span class="ab-species-name">
            <span class="ab-species-zh">${esc(species.name)}</span>
            <span class="ab-species-meta">${esc(species.nameEn)} · ${esc(speciesIdText(species.id))}</span>
          </span>
        </a>
        <div class="ab-species-slots">
          ${single ? '<span class="ab-badge ab-badge-single">單一特性</span>' : ''}
          ${slot('常見特性', reg)}
          ${slot('隱藏特性', hid)}
          ${slot('常見或隱藏（依形態）', shared)}
          ${!reg.length && !hid.length && !shared.length
            ? '<p class="ab-slot-none">這隻寶可夢沒有可列出的特性。</p>' : ''}
          ${!hid.length && !shared.length && reg.length
            ? '<p class="ab-slot-none">沒有隱藏特性</p>' : ''}
        </div>
      </li>`;
    }

    function renderSpecies() {
      const { hits, total } = filterSpecies(speciesIndex, state.q, SPECIES_RESULT_CAP);
      if (!total) {
        els.species.hidden = true;
        return { total: 0 };
      }
      const bySlug = {};
      for (const row of rows) bySlug[row.slug] = row;
      els.speciesList.innerHTML = `<ul class="ab-species-list">${hits.map(s => speciesRowHtml(s, bySlug)).join('')}</ul>`;
      // Say the limit out loud rather than truncating in silence — 574 matches
      // to a one-character query is the expected case, not an edge (§3.B2).
      els.speciesMore.hidden = total <= hits.length;
      els.speciesMore.textContent = `符合的寶可夢 ${total} 隻，只顯示前 ${hits.length} 隻，輸入更多字縮小範圍。`;
      els.species.hidden = false;
      return { total };
    }

    function render() {
      const list = filterAbilities(rows, state);
      // renderSpecies() returns { total } so it can report the cap decision to
      // the caller AND leave `els.speciesMore` written. Destructuring the NUMBER
      // is the whole use here — interpolating the object printed
      // 「符合的寶可夢 [object Object] 隻」 on a page that had just answered the
      // question correctly, which no assertion in the checker could see.
      const { total: speciesTotal } = renderSpecies();

      if (!list.length) {
        if (speciesTotal) {
          // The query DID have an answer — the Pokémon above it — so the page
          // must not also claim 「沒有符合的特性」. Two contradictory lines about
          // one query is worse than either alone.
          els.resultLine.textContent = `符合的寶可夢 ${speciesTotal} 隻 · 沒有符合的特性`;
          els.wrap.innerHTML = '';
        } else {
          els.resultLine.textContent = '沒有符合的特性';
          els.wrap.innerHTML = '<p class="ab-empty">沒有符合的篩選條件，換個關鍵字或放寬世代試試。</p>';
        }
        return;
      }

      els.resultLine.textContent =
        `顯示 ${list.length} / ${rows.length} 種特性`
        + (speciesTotal ? ` · 符合的寶可夢 ${speciesTotal} 隻` : '');

      els.wrap.innerHTML =
        `<ul class="ab-grid">${list.map(cardHtml).join('')}</ul>`;
    }

    /* ---- boot ---- */

    els.search.addEventListener('input', () => {
      state.q = els.search.value;
      setParam('q', state.q);
      render();
    });

    function status(message, isError) {
      els.status.textContent = message;
      els.status.classList.toggle('is-error', Boolean(isError));
    }

    // The reverse index is an ADDITION, so its failure is not this page's
    // failure. The 314-card grid is what abilities.html is for; a missing
    // 88 KB table must degrade to ability-search-only rather than replace the
    // page with an error. Both fetches go out together so the panel is not
    // serialised behind the first one.
    Promise.all([
      loadAbilities(),
      loadSpeciesAbilities().catch(err => {
        console.warn('[abilities] 寶可夢反向索引載入失敗，搜尋框將只比對特性', err);
        return null;
      })
    ]).then(([data, speciesData]) => {
      rows = prepareAbilities(data);
      speciesIndex = speciesData ? buildSpeciesIndex(speciesData) : [];
      els.search.value = state.q;

      // A deep link can carry anything. An unrecognised value is dropped rather
      // than rendered as a filter that matches nothing, because 「0 個特性」 with
      // no reason is indistinguishable from a broken page.
      if (state.gen && !rows.some(a => a.generation === state.gen)) {
        console.warn(`[abilities] unknown ?gen=${state.gen}, ignoring it`);
        state.gen = null;
        params.delete('gen');
      }

      renderStats();
      renderFilters();
      render();
      els.status.remove();
    }).catch(err => {
      console.error(err);
      status(
        `${location.protocol === 'file:' ? '這個頁面需要透過 HTTP 開啟（file:// 會被 CORS 擋下）。' : ''}載入特性資料失敗：${err.message}`,
        true
      );
    });
  </script>
</body>
</html>
