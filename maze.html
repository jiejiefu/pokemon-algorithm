<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢像素迷宮 (BFS/DFS)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0d1117">
  <!-- Blocking, inline, and before the stylesheet on purpose. It has to resolve a
       theme before the first paint so the page never flashes one palette and then
       repaints in the other; a module in shared.js cannot do this because module
       scripts are deferred by definition. It is also the only place a theme is
       resolved, and it ALWAYS writes a concrete value, which is why shared.css
       has no prefers-color-scheme media query: a `:root:not([data-theme="dark"])`
       block could never match once this runs. :root's dark palette is the no-JS
       fallback. Kept in sync with THEME_COLORS in assets/js/shared.js. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('pokemon-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* private mode / storage disabled: stay on the default */ }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f8fa' : '#0d1117');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
</head>
<body>
  <header class="header header-maze">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <div class="controls controls-maze">
      <button class="btn btn-nav" onclick="location.href='index.html'"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>返回大廳</button>
      <button class="btn" onclick="loadPokemonMaze(true)">1. 載入寶可夢迷宮</button>
      <button class="btn" onclick="startSearch('bfs')">2. 廣度優先搜尋 (BFS)</button>
      <button class="btn" onclick="startSearch('dfs')">3. 深度優先搜尋 (DFS)</button>
      <button class="btn" onclick="startSearch('bfs', 'star')">4. 中心四角巡航 (BFS)</button>
      <button class="btn" onclick="startSearch('dfs', 'star')">5. 中心四角巡航 (DFS)</button>
      <!-- 👇 新增：速度調整滑桿 -->
      <div class="speed-control" style="display:inline-flex; align-items:center; gap:8px; font-size:14px;">
        <label for="speedRange">速度：</label>
        <!-- min=0 max=100，平滑連續滑動，預設 30 對應約 1.0x 二次方曲線公式為 $Y = 0.1 + 9.9 \times (X / 100)^2$ -->
        <input type="range" id="speedRange" min="0" max="100" value="30" style="cursor:pointer; width: 140px;">
        <!-- 顯示當前實際算出來的速度數值 -->
        <span id="speedValue" style="font-weight:bold; min-width:38px;">1.0x</span>
      </div>
      <div style="display:inline-flex; align-items:center; gap:4px; margin-left:8px;">
        <button class="btn-sm" onclick="setSpeed(0)">0.1x</button>
        <button class="btn-sm" onclick="setSpeed(20)">0.5x</button>
        <button class="btn-sm" onclick="setSpeed(30)">1.0x</button>
        <button class="btn-sm" onclick="setSpeed(49)">2.5x</button>
        <button class="btn-sm" onclick="setSpeed(100)">10.0x</button>
      </div>
      <!-- 👇 新增：寶可夢 ID 輸入框 (支援 Enter 鍵觸發) -->
      <div class="pokemon-id-control" style="display:inline-flex; align-items:center; gap:6px; font-size:14px; margin-left:8px;">
        <label for="pokemonIdInput">寶可夢 ID：</label>
        <input type="number" id="pokemonIdInput" min="1" max="1025" placeholder="隨機" style="width:65px; padding:2px 6px; border-radius:4px; border:1px solid #ccc; text-align:center;" onkeydown="if(event.key==='Enter') loadPokemonMaze(false)">
        <button class="btn-sm" onclick="loadPokemonMaze(false)">套用 ID</button>
      </div>
      <!-- 👇 隨機迷宮 Toggle 與 Seed 輸入框 -->
      <div class="seed-control" style="display:inline-flex; align-items:center; gap:8px; font-size:14px; margin-left:8px;">
        <!-- Toggle 切換開關 (預設 checked 隨機) -->
        <label style="display:inline-flex; align-items:center; gap:4px; cursor:pointer; user-select:none;">
          <input type="checkbox" id="randomSeedToggle" checked onchange="toggleSeedVisibility()" style="cursor:pointer;">
          <span>隨機迷宮</span>
        </label>

        <!-- 當「隨機迷宮」未勾選時才顯示輸入框 (預設 display: none) -->
        <div id="seedInputContainer" style="display:none; align-items:center; gap:4px;">
          <label for="seedInput">Seed：</label>
          <input type="number" id="seedInput" value="42" style="width:70px; padding:2px 6px; border-radius:4px; border:1px solid #ccc; text-align:center;">
        </div>
      </div>
      <span id="status" class="status-text">請先載入迷宮...</span>
    </div>
  </header>

  <div class="canvas-container canvas-container-maze">
    <canvas id="mazeCanvas" class="maze-canvas"></canvas>
  </div>

  <!-- This page is otherwise a pair of CLASSIC scripts (inline onclick handlers
       throughout, which resolve on the global object, so the maze code cannot be a
       module without rewriting all of it). One small module is added purely to
       mount the shared theme toggle, and it coexists with the classic scripts
       because `type="module"` scripts are deferred. The canvas listens for the
       'themechange' event that shared.js dispatches on `document`, so a theme
       switch repaints it from the very same code path. -->
  <script type="module">
    import { initThemeToggle } from './assets/js/shared.js';
    initThemeToggle();
  </script>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    // A <canvas> is painted imperatively, so it cannot see var(--x) at all and
    // every colour drawn here has to be read back off the stylesheet. This is the
    // same mechanism as readThemeToken() in shared.js, inlined because this file
    // is a classic script and cannot import it — it re-reads on every repaint, so
    // a theme switch can never leave a stale palette behind, and the palette
    // itself still lives only in shared.css. --canvas-wall is an unquoted
    // "r, g, b" triplet, which is why it composes into a template rather than
    // needing a parse.
    const themeToken = (name) =>
      getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    
    // 迷宮設定
    const GRID_SIZE = 40;
    const CELL_SIZE = 18;
    canvas.width = GRID_SIZE * CELL_SIZE;
    canvas.height = GRID_SIZE * CELL_SIZE;

    let grid = [];
    let searchGenerator = null;
    let pathGenerator = null; // 👈 新增：用於動畫繪製最終路徑
    let animPhase = 'idle';    // 👈 新增：動畫狀態 ('search' | 'path' | 'idle')
    let isSearching = false;
    let finalPath = [];

    // 網格節點類別
    class Cell {
      constructor(x, y, colorData) {
        this.x = x;
        this.y = y;
        this.color = colorData;
        this.walls = { top: true, right: true, bottom: true, left: true };
        this.mazeVisited = false;
        this.searchVisited = false;
        this.onPath = false;
      }

      draw() {
        const px = this.x * CELL_SIZE;
        const py = this.y * CELL_SIZE;

        let alpha = 0.05; 
        if (this.onPath) alpha = 1.0;
        else if (this.searchVisited) alpha = 0.5;
        
        // Very light Pokémon would be invisible against a white canvas, so they
        // take the theme's wall colour instead. The `a < 50` test is a crude
        // lightness proxy on the sprite's own alpha channel, which is what the
        // maze has always used; it is unchanged here.
        if (this.color.a < 50) {
          ctx.fillStyle = `rgba(${themeToken('--canvas-wall')}, ${alpha})`;
        } else {
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`;
        }
        
        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);

        ctx.strokeStyle = themeToken('--canvas-grid');
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (this.walls.top) { ctx.moveTo(px, py); ctx.lineTo(px + CELL_SIZE, py); }
        if (this.walls.right) { ctx.moveTo(px + CELL_SIZE, py); ctx.lineTo(px + CELL_SIZE, py + CELL_SIZE); }
        if (this.walls.bottom) { ctx.moveTo(px, py + CELL_SIZE); ctx.lineTo(px + CELL_SIZE, py + CELL_SIZE); }
        if (this.walls.left) { ctx.moveTo(px, py + CELL_SIZE); ctx.lineTo(px, py); }
        ctx.stroke();
      }
    }

    // ================= Seed 偽隨機數產生器 (Mulberry32) =================
    let rngFunc = null;

    function initSeed(seed) {
      let a = seed;
      rngFunc = function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // 取得 0 ~ 1 之間的隨機數 (替代 Math.random)
    function seededRandom() {
      if (!rngFunc) initSeed(42);
      return rngFunc();
    }
    
    // 控制迷宮 Seed 輸入框顯示 / 隱藏
    function toggleSeedVisibility() {
      const isRandom = document.getElementById('randomSeedToggle').checked;
      const container = document.getElementById('seedInputContainer');
      if (container) {
        container.style.display = isRandom ? 'none' : 'inline-flex';
      }
    }

    // ================= 1. 圖片像素化與迷宮生成 =================

    // 寶可夢迷宮載入邏輯 (傳入 true 代表隨機抽號，false 代表讀取輸入框的 ID)
    function loadPokemonMaze(isRandom = true) {
      isSearching = false;
      searchGenerator = null;
      finalPath = [];
      grid = [];

      // --- 讀取隨機或指定 Seed ---
      const randomSeedToggle = document.getElementById('randomSeedToggle');
      const isRandomSeed = randomSeedToggle ? randomSeedToggle.checked : true;
      const seedInput = document.getElementById('seedInput');

      let seedVal;
      if (isRandomSeed) {
        // 預設隨機產生一個 Seed (1 ~ 999999)
        seedVal = Math.floor(Math.random() * 999999) + 1;
        // 同步更新隱藏的 seedInput 值（方便切換時知道上一次隨機的數值）
        if (seedInput) seedInput.value = seedVal;
      } else {
        // 讀取使用者輸入的 Seed (若為空則預設 42)
        seedVal = seedInput ? (parseInt(seedInput.value, 10) || 42) : 42;
      }
      
      // 初始化隨機數種子
      // initSeed(seedVal);

      const pokemonIdInput = document.getElementById('pokemonIdInput');
      let targetId;

      if (isRandom) {
        // 使用原生 Math.random() 隨機抽取 1 ~ 1025 的 寶可夢ID，並即時更新到輸入框上
        targetId = Math.floor(Math.random() * 1025) + 1;
        if (pokemonIdInput) {
          pokemonIdInput.value = targetId;
        }
      } else {
        // 讀取使用者手動輸入的 ID，並做範圍保護
        targetId = pokemonIdInput ? parseInt(pokemonIdInput.value, 10) : 25;
        if (isNaN(targetId) || targetId < 1 || targetId > 1025) {
          alert('請輸入有效的寶可夢 ID (1 ~ 1025)');
          return;
        }
      }

      statusText.innerText = `正在載入 # ${targetId} 寶可夢大圖 (Seed: ${seedVal})...`;

      const img = new Image();
      const imagesPath = 'assets/images/pokemon/';
      img.src = `${imagesPath}${targetId}.png`;
      img.onerror = () => {
          statusText.innerText = `載入失敗！找不到 ID #${targetId} 的寶可夢圖片。`;
        };
      img.onload = () => {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = GRID_SIZE;
        offCanvas.height = GRID_SIZE;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);
        const imgData = offCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;

        for (let y = 0; y < GRID_SIZE; y++) {
          let row = [];
          for (let x = 0; x < GRID_SIZE; x++) {
            const i = (y * GRID_SIZE + x) * 4;
            const color = { r: imgData[i], g: imgData[i+1], b: imgData[i+2], a: imgData[i+3] };
            row.push(new Cell(x, y, color));
          }
          grid.push(row);
        }

        // 關鍵修正：在生成迷宮牆壁「正前方」才重置 Seed 亂數序列！
        // 這樣不論背景換成哪隻寶可夢，Seed 42 產生的牆壁結構與拆牆順序都是 100% 相同的。
        initSeed(seedVal);
        generateMazeBacktracker();
        statusText.innerText = `迷宮生成完畢 (Seed: ${seedVal}, 寶可夢 # ${targetId})！請選擇探索演算法。`;
        drawFullMaze();
      };
    }

    // 遞迴回溯法生成迷宮 (Recursive Backtracker)
    function generateMazeBacktracker() {
      let stack = [];
      let current = grid[0][0];
      current.mazeVisited = true;

      while (true) {
        let neighbors = getUnvisitedNeighbors(current);
        if (neighbors.length > 0) {
          // 👈 將 Math.random() 替換為 seededRandom()
          let next = neighbors[Math.floor(seededRandom() * neighbors.length)];
          stack.push(current);
          removeWalls(current, next);
          next.mazeVisited = true;
          current = next;
        } else if (stack.length > 0) {
          current = stack.pop();
        } else {
          break;
        }
      }
      grid[0][0].walls.top = false;
      grid[GRID_SIZE-1][GRID_SIZE-1].walls.bottom = false;
    }

    function getUnvisitedNeighbors(cell) {
      let neighbors = [];
      let x = cell.x;
      let y = cell.y;
      if (y > 0 && !grid[y-1][x].mazeVisited) neighbors.push(grid[y-1][x]);
      if (x < GRID_SIZE-1 && !grid[y][x+1].mazeVisited) neighbors.push(grid[y][x+1]);
      if (y < GRID_SIZE-1 && !grid[y+1][x].mazeVisited) neighbors.push(grid[y+1][x]);
      if (x > 0 && !grid[y][x-1].mazeVisited) neighbors.push(grid[y][x-1]);
      return neighbors;
    }

    function removeWalls(a, b) {
      let x = a.x - b.x;
      if (x === 1) { a.walls.left = false; b.walls.right = false; }
      else if (x === -1) { a.walls.right = false; b.walls.left = false; }
      let y = a.y - b.y;
      if (y === 1) { a.walls.top = false; b.walls.bottom = false; }
      else if (y === -1) { a.walls.bottom = false; b.walls.top = false; }
    }

    // ================= 2. 尋路演算法 (BFS / DFS) =================
    
    function getAccessibleNeighbors(cell) {
      let neighbors = [];
      let x = cell.x;
      let y = cell.y;
      if (!cell.walls.top && y > 0 && !grid[y-1][x].searchVisited) neighbors.push(grid[y-1][x]);
      if (!cell.walls.right && x < GRID_SIZE-1 && !grid[y][x+1].searchVisited) neighbors.push(grid[y][x+1]);
      if (!cell.walls.bottom && y < GRID_SIZE-1 && !grid[y+1][x].searchVisited) neighbors.push(grid[y+1][x]);
      if (!cell.walls.left && x > 0 && !grid[y][x-1].searchVisited) neighbors.push(grid[y][x-1]);
      return neighbors;
    }

    // BFS Generator (使用 Queue)
    function* bfsSteps() {
      let queue = [{ cell: grid[0][0], path: [grid[0][0]] }];
      grid[0][0].searchVisited = true;

      while (queue.length > 0) {
        let { cell, path } = queue.shift();

        if (cell.x === GRID_SIZE - 1 && cell.y === GRID_SIZE - 1) {
          finalPath = path;
          return;
        }

        let neighbors = getAccessibleNeighbors(cell);
        for (let next of neighbors) {
          next.searchVisited = true;
          queue.push({ cell: next, path: [...path, next] });
        }
        yield;
      }
    }

    // DFS Generator (使用 Stack)
    function* dfsSteps() {
      let stack = [{ cell: grid[0][0], path: [grid[0][0]] }];
      grid[0][0].searchVisited = true;

      while (stack.length > 0) {
        let { cell, path } = stack.pop();

        if (cell.x === GRID_SIZE - 1 && cell.y === GRID_SIZE - 1) {
          finalPath = path;
          return;
        }

        let neighbors = getAccessibleNeighbors(cell);
        for (let next of neighbors) {
          next.searchVisited = true;
          stack.push({ cell: next, path: [...path, next] });
        }
        yield;
      }
    }

    // 👈 新增：將最終路徑逐步點亮的 Generator
    function* pathSteps() {
      for (let i = 0; i < finalPath.length; i++) {
        finalPath[i].onPath = true;
        yield;
      }
    }

    function startSearch(type) {
      if (grid.length === 0) return;
      
      for(let y=0; y<GRID_SIZE; y++) {
        for(let x=0; x<GRID_SIZE; x++) {
          grid[y][x].searchVisited = false;
          grid[y][x].onPath = false;
        }
      }
      finalPath = [];
      
      if (type === 'bfs') {
        statusText.innerText = 'BFS 探索中 (如水波般擴散)...';
        searchGenerator = bfsSteps();
      } else {
        statusText.innerText = 'DFS 探索中 (如蛇行般深入)...';
        searchGenerator = dfsSteps();
      }

      animPhase = 'search'; // 設定目前為搜尋階段

      if (!isSearching) {
        isSearching = true;
        requestAnimationFrame(renderLoop);
      }
    }

    // ================= 3. 畫面渲染迴圈 (含速度與階段控制) =================

    function drawFullMaze() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          grid[y][x].draw();
        }
      }
    }

    function setSpeed(sliderValue) {
      document.getElementById('speedRange').value = sliderValue;
    }

    // 輸入想要的速度 Y (例如 0.5, 1.0, 2.5)，回傳滑桿位置 X (0~100), 反推公式為 $X = 100 \times \sqrt{(Y - 0.1) / 9.9}$
    function getSliderValFromSpeed(targetSpeed) {
      // 限制 Y 的範圍在 0.1 ~ 10.0 之間，避免傳入小於 0.1 的數字導致開根號出現 NaN
      const clampedY = Math.max(0.1, Math.min(10.0, targetSpeed));
      
      // 反推公式
      const x = 100 * Math.sqrt((clampedY - 0.1) / 9.9);
      
      // 四捨五入取整數
      return Math.round(x);
    }

    function setSpeedByValue(speed) {
      const sliderValue = getSliderValFromSpeed(speed);
      document.getElementById('speedRange').value = sliderValue;
    }

    // 計算非線性速度的函式 (輸入 0~100，輸出 0.1~10)
    function getMappedSpeed(sliderVal) {
      const minSpeed = 0.1;
      const maxSpeed = 10.0;
      
      // 將 0~100 轉為 0~1 的比例
      const progress = sliderVal / 100; 
      
      // 使用二次方 (progress^2) 做非線性拉伸
      const mappedValue = minSpeed + (maxSpeed - minSpeed) * Math.pow(progress, 2);
      
      return mappedValue;
    }

    function renderLoop() {
      // 1. 動態讀取滑桿速度
      const speedInput = document.getElementById('speedRange');
      const speedText = document.getElementById('speedValue');

      // 2. 取得對數/曲線轉換後的實際速度 (例如 0.1, 0.5, 1.2, 2.5 等)
      const rawSpeed = speedInput ? getMappedSpeed(parseFloat(speedInput.value)) : 1.0;

      // 3. 更新介面上的數字顯示 (保留 1 位小數)
      if (speedText) {
        speedText.innerText = rawSpeed.toFixed(1) + 'x';
      }

      // 4. 處理「小於 1 步」的累積邏輯 (例如 0.1 步/幀 代表每 10 幀才走 1 步)
      // 如果數值包含小數，可以使用計數器累積步數
      let stepsToExecute = Math.floor(rawSpeed);
      
      // 處理小數點機率 (例如 speed = 0.3，有 30% 機率在這一幀多走 1 步)
      if (Math.random() < (rawSpeed % 1)) {
        stepsToExecute += 1;
      }

      // 階段一：演算法搜尋中
      if (animPhase === 'search' && searchGenerator) {
        let done = false;
        for (let i = 0; i < stepsToExecute; i++) {
          const res = searchGenerator.next();
          if (res.done) {
            done = true;
            break;
          }
        }

        if (done) {
          searchGenerator = null;
          if (finalPath.length > 0) {
            // 搜尋成功，切換到「畫出路徑」階段
            animPhase = 'path';
            pathGenerator = pathSteps();
            statusText.innerText = '探索成功！正在畫出明顯路徑...';
          } else {
            animPhase = 'idle';
            isSearching = false;
            statusText.innerText = '探索結束，未找到可行路徑！';
          }
        }
      } 
      // 階段二：逐格繪製終點路徑中
      else if (animPhase === 'path' && pathGenerator) {
        let done = false;
        for (let i = 0; i < stepsToExecute; i++) {
          const res = pathGenerator.next();
          if (res.done) {
            done = true;
            break;
          }
        }

        if (done) {
          pathGenerator = null;
          animPhase = 'idle';
          isSearching = false;
          statusText.innerText = `路徑點亮完成！成功用 ${finalPath.length} 步連至終點！`;
        }
      }

      // 重繪迷宮畫面
      drawFullMaze();

      // 如果動畫尚未完全結束，持續循環
      if (isSearching) {
        requestAnimationFrame(renderLoop);
      }
    }

    // ================= 2. 尋路演算法 (單段與多段巡航) =================

    // 取得當前搜尋段可通行的鄰居 (使用區域 visitedSet，避免上一段影響下一段的探索)
    function getAccessibleNeighborsForSegment(cell, visitedSet) {
      let neighbors = [];
      let x = cell.x;
      let y = cell.y;
      if (!cell.walls.top && y > 0 && !visitedSet.has(grid[y-1][x])) neighbors.push(grid[y-1][x]);
      if (!cell.walls.right && x < GRID_SIZE-1 && !visitedSet.has(grid[y][x+1])) neighbors.push(grid[y][x+1]);
      if (!cell.walls.bottom && y < GRID_SIZE-1 && !visitedSet.has(grid[y+1][x])) neighbors.push(grid[y+1][x]);
      if (!cell.walls.left && x > 0 && !visitedSet.has(grid[y][x-1])) neighbors.push(grid[y][x-1]);
      return neighbors;
    }

    // 單段搜尋 Generator (給定起點與終點)
    function* searchSegment(startCell, endCell, algoType) {
      let visitedSet = new Set();
      let list = [{ cell: startCell, path: [startCell] }];
      
      startCell.searchVisited = true;
      visitedSet.add(startCell);

      let foundPath = null;

      while (list.length > 0) {
        let { cell, path } = (algoType === 'bfs') ? list.shift() : list.pop();

        if (cell.x === endCell.x && cell.y === endCell.y) {
          foundPath = path;
          break;
        }

        let neighbors = getAccessibleNeighborsForSegment(cell, visitedSet);
        for (let next of neighbors) {
          next.searchVisited = true; // 累積全局探索紀錄，保持畫面半透明綠色鋪開
          visitedSet.add(next);
          list.push({ cell: next, path: [...path, next] });
        }
        yield; // 每一步 yield 給 renderLoop 繪製動畫
      }

      return foundPath;
    }

    // 中心四角巡航多段 Generator
    function* centerStarSteps(algoType) {
      const cx = Math.floor(GRID_SIZE / 2);
      const cy = Math.floor(GRID_SIZE / 2);

      const center = grid[cy][cx];
      const topLeft = grid[0][0];
      const bottomRight = grid[GRID_SIZE - 1][GRID_SIZE - 1];
      const topRight = grid[0][GRID_SIZE - 1];
      const bottomLeft = grid[GRID_SIZE - 1][0];

      // 巡航順序：中心 -> 左上, 中心 -> 右下, 中心 -> 右上, 中心 -> 左下
      const legs = [
        { start: center, end: topLeft },
        { start: center, end: bottomRight },
        { start: center, end: topRight },
        { start: center, end: bottomLeft }
      ];

      finalPath = [];

      for (let leg of legs) {
        // 👈 每次出發前，將全局畫面刷淡（重置 searchVisited）
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            grid[y][x].searchVisited = false;
          }
        }

        let gen = searchSegment(leg.start, leg.end, algoType);
        let segmentPath = null;

        while (true) {
          let res = gen.next();
          if (res.done) {
            segmentPath = res.value;
            break;
          }
          yield;
        }

        if (segmentPath) {
          if (finalPath.length === 0) {
            finalPath = segmentPath;
          } else {
            // 拼接路徑時，移除重疊的起點
            finalPath = finalPath.concat(segmentPath.slice(1));
          }
        }
      }
    }

    // BFS Generator (傳統 左上 -> 右下)
    function* bfsSteps() {
      let gen = searchSegment(grid[0][0], grid[GRID_SIZE-1][GRID_SIZE-1], 'bfs');
      while (true) {
        let res = gen.next();
        if (res.done) {
          finalPath = res.value || [];
          break;
        }
        yield;
      }
    }

    // DFS Generator (傳統 左上 -> 右下)
    function* dfsSteps() {
      let gen = searchSegment(grid[0][0], grid[GRID_SIZE-1][GRID_SIZE-1], 'dfs');
      while (true) {
        let res = gen.next();
        if (res.done) {
          finalPath = res.value || [];
          break;
        }
        yield;
      }
    }

    // 啟動搜尋入口
    function startSearch(type, mode = 'normal') {
      if (grid.length === 0) return;
      
      for(let y=0; y<GRID_SIZE; y++) {
        for(let x=0; x<GRID_SIZE; x++) {
          grid[y][x].searchVisited = false;
          grid[y][x].onPath = false;
        }
      }
      finalPath = [];
      
      if (mode === 'star') {
        statusText.innerText = `${type.toUpperCase()} 中心四角巡航探索中...`;
        searchGenerator = centerStarSteps(type);
      } else {
        if (type === 'bfs') {
          statusText.innerText = 'BFS 探索中 (如水波般擴散)...';
          searchGenerator = bfsSteps();
        } else {
          statusText.innerText = 'DFS 探索中 (如蛇行般深入)...';
          searchGenerator = dfsSteps();
        }
      }

      animPhase = 'search';

      if (!isSearching) {
        isSearching = true;
        requestAnimationFrame(renderLoop);
      }
    }

    function drawIdlePrompt() {
      ctx.fillStyle = themeToken('--canvas-bg');
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = themeToken('--canvas-text');
      ctx.font = '24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('請點擊上方按鈕載入迷宮', canvas.width/2, canvas.height/2);
    }

    // A canvas is opaque once painted, so switching the page palette underneath it
    // changes nothing until something redraws. Both the idle prompt and a loaded
    // maze therefore have to be repainted explicitly, and colours are re-read
    // rather than cached so this cannot land on the old palette.
    document.addEventListener('themechange', () => {
      if (grid.length) drawFullMaze();
      else drawIdlePrompt();
    });

    // 頁面載入時初始提示
    window.onload = drawIdlePrompt;
  </script>
</body>
</html>
