<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1025 全國寶可夢圖鑑</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1020">
  <!-- Blocking, inline, and before the stylesheet on purpose. It has to resolve a
       theme before the first paint so the page never flashes one palette and then
       repaints in the other; a module in shared.js cannot do this because module
       scripts are deferred by definition. It is also the only place a theme is
       resolved, and it ALWAYS writes a concrete value, which is why shared.css
       has no prefers-color-scheme media query: a `:root:not([data-theme="dark"])`
       block could never match once this runs. :root's dark palette is the no-JS
       fallback. Kept in sync with THEME_COLORS in assets/js/shared.js. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('pokemon-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* private mode / storage disabled: stay on the default */ }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0b1020');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/shared.css">
  <style>
    .search-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: var(--bg-controls);
    }
    .search-input,
    .search-select {
      padding: 10px 15px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-input);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 16px;
      transition: border-color var(--transition-fast);
    }
    .search-input:focus,
    .search-select:focus {
      border-color: var(--accent-yellow);
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
    }
    .search-select {
      min-width: 140px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 20px;
      background: var(--sticky-surface);
      border-top: 1px solid var(--hairline);
    }
    .filter-select {
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-input);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
    }
    .filter-select:focus {
      border-color: var(--accent-yellow);
    }
    /* Colour-page entries. These are a second axis onto the same 1,025 — the
       filter row above narrows by Pokemon attributes, these browse by the
       palette a sprite actually contains — so they get their own row instead of
       competing with the filters for one. Two earlier placements both failed:
       .view-all-link is a standalone centred CTA (margin: 24px auto 0) and
       pushed them 24px below the row, and `align-self: stretch` to match the
       selects' height SHRANK the selects themselves from 61px to 37px, because
       every item in .filter-group is align-items:normal. Neither the 61px nor
       any substitute is written down here: it is a UA-sized <select> height
       that moves with platform and font settings. */
    .filter-extras {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 20px 14px;
      background: var(--sticky-surface);
    }
    .filter-extras-label { font-size: 13px; color: var(--text-muted); }
    .filter-link {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-input);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
    }
    .filter-link:hover { border-color: var(--accent-yellow); color: var(--accent-gold); }
    .results-info {
      padding: 12px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-controls);
      border-bottom: 1px solid var(--hairline);
    }

    /* ===== Page hero =====
       The third instance of this site's hero pattern, after .gen-hero
       (generations.html) and .coll-hero (collections.html). Both of those are
       transcriptions of InfoPoke's pokedex hero, so the structure — gradient,
       black scrim, centred title, lede, span, four stat tiles — is copied rather
       than reinvented, and only the tokens below differ.

       THE GRADIENT IS DARKER THAN THE SOURCE ON PURPOSE. InfoPoke's hero is
       `from-blue-500 via-purple-500 to-pink-500` over a `bg-black/10` scrim.
       Measured through that scrim, the three stops give white text 4.43:1 /
       4.77:1 / 4.27:1, and an rgba(255,255,255,.8) stat label 3.72:1 / 4.00:1 /
       3.58:1 — every one of those below the 4.5:1 that WCAG AA sets for body
       text. Stepping the same hues down to blue-600 / violet-500 / pink-600
       gives white 6.10:1 / 6.34:1 / 5.49:1 and the .8 label 5.11:1 / 5.32:1 /
       4.60:1, so the worst cell clears AA with 0.10 to spare. The hue path, and
       therefore the InfoPoke feel, is unchanged.

       `.gen-hero` got here first and documents the same correction on its own
       block ("black/10, not the source's white/10 ... the 3.58:1 that decided
       it"). Copying its NUMBERS is what makes this safe; copying InfoPoke's
       colours is not.

       `position: relative` + `isolation: isolate` and the explicit z-index pair
       are load-bearing, not decoration: the scrim is a ::before, and ::before
       with z-index auto paints in tree order — i.e. ON TOP of the h1. See
       generations.html's .gen-hero block for the full argument. */
    .dex-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #2563eb 0%, #9333ea 50%, #db2777 100%);
      color: #fff;
      /* Less vertical padding than .gen-hero's 80px: this page's next row is the
         search box, and the hero is the one thing standing between the header and
         the control the page exists for. */
      padding: 56px 16px;
      margin: 24px auto 36px;
      max-width: 1180px;
      box-shadow: var(--shadow-card);
    }

    .dex-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.1);
    }

    .dex-hero > * {
      position: relative;
      z-index: 1;
    }

    .dex-hero-title {
      margin: 0 0 16px;
      font-size: 36px;
      line-height: 1.2;
      font-weight: bold;
      text-align: center;
      text-shadow: var(--header-title-shadow);
    }

    .dex-hero-lede {
      margin: 0 auto 16px;
      max-width: 768px;
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    .dex-hero-span {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    /* 2 tiles on mobile, 4 from 640px — named rather than left to auto-fit, so
       the column count is a decision on record. Same reasoning as .gen-hero-stats. */
    .dex-hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 40px auto 0;
      max-width: 768px;
      padding: 0;
      list-style: none;
    }

    /* black/10, not InfoPoke's white/10. A white scrim LIGHTENS the fill, and
       these are white numbers on it — it would push them further below AA, not
       closer. The white/18 border is kept because a darker tile on a lighter
       gradient needs its edge, and it is what the print rule below restates. */
    .dex-hero-stats li {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .dex-hero-stats strong {
      display: block;
      font-size: 30px;
      line-height: 1.2;
      font-weight: bold;
    }

    .dex-hero-stats span {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    @media (min-width: 640px) {
      .dex-hero { padding: 64px 24px; }
      .dex-hero-title { font-size: 48px; }
      .dex-hero-lede { font-size: 20px; }
      .dex-hero-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (min-width: 1024px) {
      .dex-hero-title { font-size: 60px; }
    }

    /* Print is a third palette (shared.css's own @media print block). This
       gradient cannot survive it: browsers drop background colours unless the
       user ticks "background graphics", which would leave white text on white
       paper.

       The scrim has to be hidden EXPLICITLY. `.dex-hero { background: none }`
       does nothing to a ::before that paints its own background, so the
       black/10 would print as a 10% grey rectangle sitting on top of the text.
       `.dex-hero > *` needs no rule — z-index on positioned elements is a paint
       hint, and with both the ::before and the gradient gone there is nothing
       left to occlude. */
    @media print {
      .dex-hero::before { display: none; }

      .dex-hero {
        background: none;
        color: var(--text-primary);
        box-shadow: none;
        padding: 0 0 24px;
      }

      .dex-hero-title,
      .dex-hero-lede,
      .dex-hero-span,
      .dex-hero-stats span {
        color: var(--text-primary);
        text-shadow: none;
      }

      .dex-hero-stats li {
        background: none;
        border-color: var(--hairline);
      }
    }
  </style>
</head>
<body>
  <header class="header header-dex">
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="淺色主題" title="淺色主題"></button>
    <a class="header-brand" href="index.html" aria-label="回到寶可夢演算法首頁"><span class="site-logo"><img src="assets/images/logo.png" alt="" width="180" height="180" decoding="async"></span>
      <!-- A div, not an <h1>: the header title is the site brand (寶可夢演算法)
           on every page, so the page's own <h1> lives in the content area below.
           Two h1s on one page remains the one combination that appears nowhere
           in the site. -->
      <div class="header-title header-title-large">寶可夢演算法</div>
    </a>
    <nav class="site-nav" data-nav aria-label="主選單"></nav>
    <button class="site-nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="開啟選單"></button>
    <div class="site-nav-drawer" data-nav data-nav-drawer hidden></div>
  </header>

  <!-- The page's single h1. Same structure as gen-hero (generations.html) and
     coll-hero (collections.html) — both are transcriptions of InfoPoke's pokedex
     hero, so this is the third instance of one pattern, not a new layout. The
     gradient is the same HUE PATH as InfoPoke's blue→purple→pink but stepped down
     to -600/-700: InfoPoke's own -500 stops measure 4.43:1 for the lede and 3.58:1
     for a stat label under a black/10 scrim, so a verbatim copy fails WCAG AA.
     These stops measure 5.11:1 and 5.32:1 at their lightest. See the block
     comment on .dex-hero below. -->
  <section class="dex-hero" aria-labelledby="dex-hero-title">
    <h1 class="dex-hero-title" id="dex-hero-title">1025 全國寶可夢圖鑑</h1>
    <p class="dex-hero-lede">1,025 隻寶可夢的完整圖鑑，涵蓋 9 個世代、18 種屬性。</p>
    <p class="dex-hero-span">從關都 (1996) 到帕底亞 (2022) — 26 年的寶可夢進化史</p>
    <!-- A <ul>, like gen-hero: these four numbers are a list of facts about the
         page, and a <ul>/<li> says so where a grid of <div>s would not. The "—"
         is deliberate — a number only lands here once it is real, so a tile can
         never show a placeholder that turns out to be wrong. -->
    <ul class="dex-hero-stats">
      <li><strong id="dex-stat-total">—</strong><span>寶可夢總數</span></li>
      <li><strong id="dex-stat-gens">—</strong><span>世代</span></li>
      <li><strong id="dex-stat-types">—</strong><span>屬性</span></li>
      <li><strong id="dex-stat-legendary">—</strong><span>傳說＋幻之</span></li>
    </ul>
  </section>

  <div class="search-controls">
    <input type="text" id="searchInput" class="search-input" 
           placeholder="搜尋編號、中文、英文、日文名稱..." 
           list="pokemon-suggestions" autocomplete="off">
    <datalist id="pokemon-suggestions"></datalist>
  </div>

  <div class="filter-group">
    <select id="typeFilter" class="filter-select">
      <option value="all">所有屬性</option>
    </select>
    <select id="colorFilter" class="filter-select">
      <option value="all">所有顏色</option>
      <option value="red">紅色</option>
      <option value="blue">藍色</option>
      <option value="green">綠色</option>
      <option value="yellow">黃色</option>
      <option value="purple">紫色</option>
      <option value="pink">粉色</option>
      <option value="brown">棕色</option>
      <option value="black">黑色</option>
      <option value="white">白色</option>
      <option value="gray">灰色</option>
    </select>
    <select id="genFilter" class="filter-select">
      <option value="all">所有世代</option>
      <option value="1">第 1 世代 (關都)</option>
      <option value="2">第 2 世代 (城都)</option>
      <option value="3">第 3 世代 (豐緣)</option>
      <option value="4">第 4 世代 (神奧)</option>
      <option value="5">第 5 世代 (合眾)</option>
      <option value="6">第 6 世代 (卡洛斯)</option>
      <option value="7">第 7 世代 (阿羅拉)</option>
      <option value="8">第 8 世代 (伽勒爾)</option>
      <option value="9">第 9 世代 (帕底亞)</option>
    </select>
    <button id="clearFilters" class="filter-select" style="background:var(--accent-gold);color:var(--on-accent);border:none;font-weight:bold;">清除篩選</button>
  </div>

  <div class="filter-extras">
    <span class="filter-extras-label">依色盤瀏覽：</span>
    <!-- The single-Pokemon page is not linked from here — it needs a slug, so it
         is reached from a card. All three colour pages are in the header's 色彩
         trigger regardless; this row is a convenience, not the only way in. -->
    <a class="filter-link" href="colors-explore.html">色彩探索</a>
    <a class="filter-link" href="colors.html">色彩生成器</a>
  </div>

  <div class="results-info" id="resultsInfo">載入中...</div>

  <div id="loading" class="loading-text">讀取圖鑑資料中...</div>
  <div id="pokedex-grid" class="pokedex-grid"></div>

  <script type="module">
    import {loadPokemonData, createPokemonCard, pokemonDetailUrl, TYPE_EN_ZH, initThemeToggle, initHeaderNav } from './assets/js/shared.js';
    // Wire the theme toggle before anything else. Module scripts are deferred, so
    // the DOM is already parsed here and the button in the header is present.
    initThemeToggle();
    initHeaderNav('pokedex.html');

    const grid = document.getElementById('pokedex-grid');
    const loading = document.getElementById('loading');
    const searchInput = document.getElementById('searchInput');
    const datalist = document.getElementById('pokemon-suggestions');
    const typeFilter = document.getElementById('typeFilter');
    const colorFilter = document.getElementById('colorFilter');
    const genFilter = document.getElementById('genFilter');
    const clearBtn = document.getElementById('clearFilters');
    const resultsInfo = document.getElementById('resultsInfo');
    
    let allPokemonData = [];

    // generations.html deep-links here as pokedex.html?gen=N. The value is
    // validated before it reaches the <select> because a hand-edited or stale
    // link can carry anything, and assigning genFilter.value = '99' would
    // silently render the unfiltered 1025 while the URL claims a generation.
    // The application is deliberately NOT here: filterPokedex() needs
    // allPokemonData, so the param is applied once the fetch resolves below.
    const genParam = new URLSearchParams(location.search).get('gen');
    if (genParam && /^[1-9]$/.test(genParam)) {
      genFilter.value = genParam;
    }

    // Keep ?gen= in the address bar so a filtered view can be shared or
    // reloaded. replaceState, not pushState: this is a refinement of the view
    // the user is already on, not a navigation they should have to go back to.
    function syncUrl() {
      const url = new URL(location.href);
      if (genFilter.value === 'all') {
        url.searchParams.delete('gen');
      } else {
        url.searchParams.set('gen', genFilter.value);
      }
      history.replaceState(null, '', url);
    }

    /* The hero's four tiles. Every number is derived from the array already in
       hand — no second fetch, which is the same move .gen-hero makes. That also
       means the lede and the span above the tiles, which quote 1,025 / 9 / 18 in
       prose, cannot drift from the tiles: if the dataset ever changes, the
       counts move together and the static text is what needs revisiting.

       傳說＋幻之 is one tile, not two: .dex-hero-stats is a 4-column grid at every
       breakpoint above 640px, and five tiles would leave an orphan on its own
       row. 幻之 is this site's word for mythical everywhere else — the
       colors-explore facet list pairs 傳說/幻之 and index.html's quick link says
       幻之寶可夢. is_legendary and is_mythical are separate booleans in
       pokemon_data.json (71 and 23 respectively, 94 together). */
    function renderHeroStats() {
      const gens = new Set(allPokemonData.map(p => p.generation)).size;
      const tiles = {
        'dex-stat-total': allPokemonData.length.toLocaleString('en-US'),
        'dex-stat-gens': gens,
        // TYPE_EN_ZH is the site's own 18-key map, already imported above for the
        // filter dropdown, so the tile and the dropdown cannot disagree on how
        // many types there are.
        'dex-stat-types': Object.keys(TYPE_EN_ZH).length,
        'dex-stat-legendary': allPokemonData.filter(p => p.is_legendary || p.is_mythical).length,
      };
      for (const [id, value] of Object.entries(tiles)) {
        document.getElementById(id).textContent = value;
      }
    }

    async function fetchPokedex() {
      try {
        allPokemonData = await loadPokemonData();
        loading.style.display = 'none';

        renderHeroStats();

        // Populate datalist for autocomplete
        populateDatalist();
        
        // Populate type filter
        populateTypeFilter();
        
        // filterPokedex(), not renderGrid(allPokemonData): with every control at
        // its default this is the same call, and it is the only one that honours
        // a ?gen= in the URL. Calling it here rather than at parse time is the
        // whole reason the param is stored above instead of applied.
        filterPokedex();
      } catch (error) {
        loading.innerText = '載入失敗，請確認是否使用 Local Server 開啟。';
        console.error(error);
      }
    }

    function populateDatalist() {
      datalist.innerHTML = '';
      allPokemonData.forEach(p => {
        const names = [
          String(p.id),
          p.names?.zh,
          p.names?.zh_HK,
          p.names?.en,
          p.names?.ja
        ].filter(Boolean);
        
        names.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          datalist.appendChild(option);
        });
      });
    }

    function populateTypeFilter() {
      // Get all unique types from data
      const typeSet = new Set();
      allPokemonData.forEach(p => {
        if (p.types) p.types.forEach(t => typeSet.add(t));
      });
      
      const sortedTypes = Array.from(typeSet).sort();
      
      sortedTypes.forEach(t => {
        const zh = TYPE_EN_ZH[t] || t;
        const option = document.createElement('option');
        option.value = t;
        option.textContent = `${zh} (${t})`;
        typeFilter.appendChild(option);
      });
    }

    function renderGrid(dataArray) {
      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();
      
      dataArray.forEach(pokemon => {
        fragment.appendChild(createPokemonCard(pokemon, {
          onClick: (id) => window.location.href = pokemonDetailUrl(dataArray.find(pokemon => pokemon.id === id)),
          showTypes: true
        }));
      });
      
      grid.appendChild(fragment);
      updateResultsInfo(dataArray.length);
    }

    function updateResultsInfo(count) {
      resultsInfo.textContent = `顯示 ${count} / ${allPokemonData.length} 隻寶可夢`;
    }

    function filterPokedex() {
      const searchText = searchInput.value.toLowerCase().trim();
      const selectedType = typeFilter.value;
      const selectedColor = colorFilter.value;
      const selectedGen = genFilter.value;

      const filteredData = allPokemonData.filter(pokemon => {
        // Search match
        let matchSearch = true;
        if (searchText) {
          const idMatch = String(pokemon.id).includes(searchText);
          const zhMatch = pokemon.names?.zh?.toLowerCase().includes(searchText);
          const zhHKMatch = pokemon.names?.zh_HK?.toLowerCase().includes(searchText);
          const enMatch = pokemon.names?.en?.toLowerCase().includes(searchText);
          const jaMatch = pokemon.names?.ja?.includes(searchText);
          matchSearch = idMatch || zhMatch || zhHKMatch || enMatch || jaMatch;
        }

        // Type match
        let matchType = true;
        if (selectedType !== 'all' && pokemon.types) {
          matchType = pokemon.types.includes(selectedType);
        }

        // Color match (using PokeAPI color)
        let matchColor = true;
        if (selectedColor !== 'all') {
          matchColor = pokemon.color?.toLowerCase() === selectedColor;
        }

        // Generation match
        let matchGen = true;
        if (selectedGen !== 'all') {
          matchGen = pokemon.generation == parseInt(selectedGen);
        }

        return matchSearch && matchType && matchColor && matchGen;
      });

      renderGrid(filteredData);
    }

    function clearFilters() {
      searchInput.value = '';
      typeFilter.value = 'all';
      colorFilter.value = 'all';
      genFilter.value = 'all';
      renderGrid(allPokemonData);
      syncUrl();
    }

    // Event listeners
    searchInput.addEventListener('input', filterPokedex);
    typeFilter.addEventListener('change', filterPokedex);
    colorFilter.addEventListener('change', filterPokedex);
    // Only the generation select writes the URL — doing it from filterPokedex()
    // would rewrite the address bar on every keystroke in the search box.
    genFilter.addEventListener('change', () => { filterPokedex(); syncUrl(); });
    clearBtn.addEventListener('click', clearFilters);

    // Allow Enter key on search to focus first result
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchInput.value) {
        // Optionally navigate to first match
      }
    });

    window.onload = fetchPokedex;
  </script>
</body>
</html>
